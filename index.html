<script>
/* ==== js/ui/components.js ==== */
/* ============================================================
   ВЕКТОР · UI: компоненты (модалка, тост, формы, карточки, метрики)
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils;
  var I = App.icons;
  var S = App.store;
  var C = {};

  /* ============================================================
     МОДАЛКА
     cfg: {title, subtitle, body, actions, wide, onMount(el, api)}
     ============================================================ */
  C.modal = function (cfg) {
    var root = U.$('#modal-root');
    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    overlay.innerHTML =
      '<div class="modal' + (cfg.wide ? ' modal--wide' : '') + '">' +
        '<div class="modal-head">' +
          '<div>' +
            (cfg.title ? '<h2 class="modal-title">' + U.esc(cfg.title) + '</h2>' : '') +
            (cfg.subtitle ? '<p class="modal-sub">' + U.esc(cfg.subtitle) + '</p>' : '') +
          '</div>' +
          '<button class="icon-btn" data-close aria-label="Закрыть">' + I.icon('x', 18) + '</button>' +
        '</div>' +
        '<div class="modal-body">' + (cfg.body || '') + '</div>' +
        (cfg.actions ? '<div class="modal-foot">' + cfg.actions + '</div>' : '') +
      '</div>';

    root.innerHTML = '';
    root.appendChild(overlay);

    var api = {
      el: overlay,
      close: function () {
        if (root.firstChild === overlay) root.innerHTML = '';
        document.removeEventListener('keydown', onKey);
      }
    };
    function onKey(e) { if (e.key === 'Escape') api.close(); }

    overlay.addEventListener('click', function (e) { if (e.target === overlay) api.close(); });
    U.$$('[data-close]', overlay).forEach(function (b) { b.addEventListener('click', api.close); });
    document.addEventListener('keydown', onKey);

    if (cfg.onMount) cfg.onMount(overlay, api);
    var first = overlay.querySelector('input,textarea,select');
    if (first) setTimeout(function () { first.focus(); }, 60);
    return api;
  };

  /* ============================================================
     ПОДТВЕРЖДЕНИЕ
     ============================================================ */
  C.confirm = function (title, text, onYes, yesLabel) {
    C.modal({
      title: title,
      subtitle: text,
      body: '',
      actions:
        '<button class="btn btn--ghost" data-close>Отмена</button>' +
        '<button class="btn btn--primary" data-yes>' + U.esc(yesLabel || 'Подтвердить') + '</button>',
      onMount: function (el, api) {
        el.querySelector('[data-yes]').addEventListener('click', function () { api.close(); onYes(); });
      }
    });
  };

  /* ============================================================
     ТОСТ
     ============================================================ */
  C.toast = function (msg, type, duration) {
    type = type || 'accent';
    duration = duration || 2600;
    var root = U.$('#toast-root');
    if (!root) return;
    var t = document.createElement('div');
    t.className = 'toast toast--' + type;
    var ic = { ok: 'check', bad: 'x', accent: 'zap', fire: 'flame' };
    t.innerHTML = I.icon(ic[type] || 'zap', 16) + '<span>' + U.esc(msg) + '</span>';
    root.appendChild(t);
    setTimeout(function () {
      t.classList.add('out');
      setTimeout(function () { t.remove(); }, 260);
    }, duration);
  };

  /* ============================================================
     ФОРМА
     type: text|number|date|textarea|select|days|checkbox|hidden
     ============================================================ */
  C.formHTML = function (fields, submitText, submitClass) {
    return '<form class="vform">' +
      '<div class="form-grid">' +
        fields.map(function (f) {
          if (f.type === 'hidden') return '<input type="hidden" name="' + f.name + '" value="' + U.esc(f.value) + '">';
          var span = f.span === 2 || f.type === 'textarea' || f.type === 'days' ? ' full' : '';
          var label = f.label ? '<label>' + U.esc(f.label) + (f.required ? ' <span class="text-accent">*</span>' : '') + '</label>' : '';
          var hint = f.hint ? '<span class="hint">' + U.esc(f.hint) + '</span>' : '';
          var ctrl;

          if (f.type === 'textarea') {
            ctrl = '<textarea class="textarea" name="' + f.name + '" rows="' + (f.rows || 3) + '" placeholder="' + U.esc(f.placeholder || '') + '"' + (f.required ? ' required' : '') + '>' + U.esc(f.value || '') + '</textarea>';
          } else if (f.type === 'select') {
            ctrl = '<select class="select" name="' + f.name + '"' + (f.required ? ' required' : '') + '>' +
              (f.options || []).map(function (o) {
                return '<option value="' + U.esc(o.value) + '"' + (String(o.value) === String(f.value) ? ' selected' : '') + '>' + U.esc(o.label) + '</option>';
              }).join('') + '</select>';
          } else if (f.type === 'days') {
            var sel = f.value || [1,2,3,4,5,6,0];
            ctrl = '<div class="row row-tight">' + U.DOW_LABEL.map(function (lbl, i) {
              var d = i === 6 ? 0 : i + 1;
              var on = sel.indexOf(d) !== -1;
              return '<button type="button" class="btn btn--sm ' + (on ? 'btn--primary' : 'btn--quiet') + '" data-day="' + d + '">' + lbl + '</button>';
            }).join('') + '</div>' +
            '<input type="hidden" name="' + f.name + '" value="' + sel.join(',') + '">';
          } else if (f.type === 'checkbox') {
            ctrl = '<label class="row" style="gap:8px;cursor:pointer">' +
              '<input type="checkbox" name="' + f.name + '"' + (f.value ? ' checked' : '') + '> ' +
              '<span class="text-sm">' + U.esc(f.text || '') + '</span></label>';
          } else {
            ctrl = '<input class="input" type="' + (f.type || 'text') + '" name="' + f.name + '" value="' + U.esc(f.value || '') + '"' +
              ' placeholder="' + U.esc(f.placeholder || '') + '"' +
              (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') +
              (f.step ? ' step="' + f.step + '"' : '') + (f.required ? ' required' : '') + '>';
          }
          return '<div class="field' + span + '">' + label + ctrl + hint + '</div>';
        }).join('') +
      '</div>' +
      '<div class="modal-foot">' +
        '<button type="button" class="btn btn--ghost" data-close>Отмена</button>' +
        '<button type="submit" class="btn ' + (submitClass || 'btn--primary') + '">' + U.esc(submitText || 'Сохранить') + '</button>' +
      '</div>' +
    '</form>';
  };

  /* Открывает модалку с формой и возвращает значения через onSubmit */
  C.formModal = function (fields, onSubmit, submitText, cfg) {
    cfg = cfg || {};
    C.modal({
      title: cfg.title || 'Новая запись',
      subtitle: cfg.subtitle || '',
      wide: cfg.wide,
      body: (cfg.prepend || '') + C.formHTML(fields, submitText, cfg.submitClass),
      onMount: function (el, api) {
        var form = el.querySelector('form');

        /* переключатель дней недели */
        U.$$('[data-day]', el).forEach(function (b) {
          b.addEventListener('click', function () {
            var hidden = form.querySelector('input[type="hidden"][name="' + b.closest('.field').querySelector('[name]').name + '"]');
            var d = Number(b.getAttribute('data-day'));
            var cur = (hidden.value ? hidden.value.split(',') : []).map(Number);
            var idx = cur.indexOf(d);
            if (idx === -1) cur.push(d); else cur.splice(idx, 1);
            hidden.value = cur.join(',');
            b.classList.toggle('btn--primary', idx === -1);
            b.classList.toggle('btn--quiet', idx !== -1);
          });
        });

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var fd = new FormData(form);
          var v = {};
          fields.forEach(function (f) {
            if (f.type === 'checkbox') v[f.name] = fd.get(f.name) ? true : false;
            else v[f.name] = fd.get(f.name);
          });
          if (cfg.validate) {
            var err = cfg.validate(v);
            if (err) { showErr(el, err); return; }
          }
          api.close();
          onSubmit(v);
        });
      }
    });
  };

  function showErr(el, msg) {
    var old = el.querySelector('.form-err');
    if (old) old.remove();
    var box = document.createElement('p');
    box.className = 'form-err';
    box.textContent = msg;
    el.querySelector('.form-grid').appendChild(box);
  }

  /* ============================================================
     МЕЛКИЕ БЛОКИ
     ============================================================ */
  C.statTile = function (k, v, x, accent) {
    return '<div class="stat' + (accent ? ' stat--accent' : '') + '">' +
      (k ? '<span class="stat-k">' + U.esc(k) + '</span>' : '') +
      '<span class="stat-v">' + U.esc(String(v)) + '</span>' +
      (x ? '<span class="stat-x">' + U.esc(String(x)) + '</span>' : '') +
    '</div>';
  };

  C.section = function (title, note, body, actions) {
    return '<section class="sec">' +
      '<div class="sec-head">' +
        '<h2 class="sec-title">' + U.esc(title) + '</h2>' +
        (note ? '<span class="sec-note">' + U.esc(note) + '</span>' : '') +
        (actions ? '<div class="sec-actions">' + actions + '</div>' : '') +
      '</div>' + body +
    '</section>';
  };

  C.card = function (opts, body) {
    opts = opts || {};
    return '<div class="card' + (opts.cls ? ' ' + opts.cls : '') + '">' +
      (opts.title ? '<div class="card-head">' +
        '<span class="card-title">' + (opts.icon ? I.icon(opts.icon, 15) : '') + U.esc(opts.title) + '</span>' +
        (opts.note ? '<span class="card-note">' + U.esc(opts.note) + '</span>' : '') +
        (opts.actions ? '<div class="row row-tight">' + opts.actions + '</div>' : '') +
      '</div>' : '') +
      body + '</div>';
  };

  C.progress = function (pct, cls, thin) {
    return '<div class="bar' + (thin ? ' bar--thin' : '') + (cls ? ' bar--' + cls : '') + '">' +
      '<div class="bar-fill" style="width:' + U.clamp(Math.round(pct), 0, 100) + '%"></div></div>';
  };

  C.ring = function (pct, size, sw, label) {
    size = size || 48; sw = sw || 4;
    pct = U.clamp(Math.round(pct || 0), 0, 100);
    var r = (size - sw) / 2;
    var circ = 2 * Math.PI * r;
    var off = circ - (pct / 100) * circ;
    return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
        '<circle class="ring-track" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke-width="' + sw + '"/>' +
        '<circle class="ring-fill" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke-width="' + sw + '" stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '</svg>' +
      '<span class="ring-label" style="font-size:' + Math.round(size * .28) + 'px">' + (label != null ? U.esc(label) : pct + '%') + '</span>' +
    '</div>';
  };

  C.empty = function (icon, text, action) {
    return '<div class="empty">' + I.icon(icon, 26) + '<p>' + U.esc(text) + '</p>' + (action || '') + '</div>';
  };

  C.chipPrio = function (p) {
    if (p === 'high') return '<span class="chip chip--hi">Высокий</span>';
    if (p === 'low') return '<span class="chip chip--low">Низкий</span>';
    return '<span class="chip chip--mid">Средний</span>';
  };

  C.clock = function (mins) {
    return '<span class="chip"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.6"/></svg>' + U.minutesToHm(mins) + '</span>';
  };

  /* Категория → стабильный цвет из палитры */
  C.catColor = function (cat) {
    var n = 0, s = String(cat || '');
    for (var i = 0; i < s.length; i++) n = (n + s.charCodeAt(i)) % 8;
    return 'var(--cat-' + (n + 1) + ')';
  };
  C.chipCat = function (cat) {
    if (!cat) return '';
    return '<span class="chip chip--cat" style="--c:' + C.catColor(cat) + '">' + U.esc(cat) + '</span>';
  };

  C.segmented = function (items, active) {
    return '<div class="seg">' + items.map(function (it) {
      return '<button type="button" class="seg-btn' + (it.value === active ? ' active' : '') + '" data-seg="' + U.esc(it.value) + '">' + U.esc(it.label) + '</button>';
    }).join('') + '</div>';
  };

  /* ============================================================
     НАВИГАЦИЯ / ТОПБАР
     ============================================================ */
  C.updateNav = function (activeId) {
    U.$$('#sideNav .nav-item').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-route') === activeId);
    });
    U.$$('#tabs .tab-item').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-route') === activeId);
    });
  };

  C.updateTop = function (route, params) {
    var t = U.$('#topTitle'), s = U.$('#topSub'), r = U.$('#topRight');
    if (t) t.textContent = route.title || 'Вектор';
    if (s) s.textContent = U.fmtLong(U.todayKey());
    if (r) {
      var St = App.stats;
      var streak = St.overallStreak();
      var lvl = St.levelInfo();
      var today = U.todayKey();
      var snap = St.daySnapshot(today);
      r.innerHTML =
        '<span class="top-badge" title="Выполнено сегодня">' + I.icon('check', 13) + ' ' + snap.done + '/' + snap.total + '</span>' +
        (streak > 0 ? '<span class="top-badge" title="Серия дней">' + I.icon('flame', 13) + ' ' + streak + '</span>' : '') +
        '<span class="top-badge" title="' + lvl.xp + ' XP">' + I.icon('star', 13) + ' Ур. ' + lvl.level + '</span>' +
        '<button class="icon-btn icon-btn--line" id="themeBtn" aria-label="Сменить тему">' +
          I.icon(App.store.state.settings.theme === 'dark' ? 'sun' : 'moon', 16) + '</button>';
      var tb = U.$('#themeBtn');
      if (tb) tb.addEventListener('click', function () { App.theme.toggle(); });
    }
  };

  App.ui = C;
})(window.App = window.App || {});

</script>
<script>
/* ==== js/ui/charts.js ==== */
/* ============================================================
   ВЕКТОР · UI: SVG-графики без внешних библиотек
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils;
  var C = App.ui;
  var Ch = {};

  /* Контейнер может отсутствовать (мало данных, другой экран) — график
     должен молча пропуститься, а не ронять весь экран. */

  /* ---------- Линейный график ---------- */
  Ch.line = function (host, data, opts) {
    if (!host) return;
    opts = opts || {};
    var W = opts.width || 700, H = opts.height || 200;
    var pad = { t: 20, r: 20, b: 30, l: 38 };
    var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    var maxV = opts.maxV || 100;
    var len = data.length;
    if (len < 2) { host.innerHTML = '<p class="text-3 text-sm" style="padding:40px 0">Мало данных</p>'; return; }

    var points = data.map(function (d, i) {
      var x = pad.l + (i / (len - 1)) * pw;
      var y = pad.t + ph - (d.pct / maxV) * ph;
      return x + ',' + y;
    });

    var areaPath = 'M' + pad.l + ',' + (pad.t + ph) + ' ' +
      points.map(function (p, i) {
        var x = pad.l + (i / (len - 1)) * pw;
        return 'L' + x + ',' + (pad.t + ph - (data[i].pct / maxV) * ph);
      }).join(' ') +
      ' L' + (pad.l + pw) + ',' + (pad.t + ph) + ' Z';

    var linePath = 'M' + points.join(' L');

    var gridLines = [0, 25, 50, 75, 100].map(function (v) {
      var y = pad.t + ph - (v / maxV) * ph;
      return '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (pad.l + pw) + '" y2="' + y + '" stroke="currentColor" stroke-opacity=".07" stroke-width="1"/>' +
        '<text x="' + (pad.l - 6) + '" y="' + (y + 4) + '" text-anchor="end" fill="currentColor" fill-opacity=".3" font-size="10" font-family="var(--font-num)">' + v + '</text>';
    }).join('');

    /* x-метки */
    var xLabels = '';
    var step = Math.max(1, Math.floor(len / 10));
    for (var i = 0; i < len; i += step) {
      var x = pad.l + (i / (len - 1)) * pw;
      var lbl = data[i].label || data[i].date.slice(8) || '';
      xLabels += '<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle" fill="currentColor" fill-opacity=".35" font-size="10" font-family="var(--font-num)">' + U.esc(lbl) + '</text>';
    }

    /* точки */
    var dots = data.map(function (d, i) {
      var x = pad.l + (i / (len - 1)) * pw;
      var y = pad.t + ph - (d.pct / maxV) * ph;
      return '<circle cx="' + x + '" cy="' + y + '" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5" title="' + (U.esc(d.label || d.date) + ': ' + d.pct + '%') + '"/>';
    }).join('');

    host.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block" preserveAspectRatio="none">' +
        '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="100%" stop-color="var(--accent)" stop-opacity=".01"/></linearGradient></defs>' +
        '<path d="' + areaPath + '" fill="url(#ag)"/>' +
        '<path d="' + linePath + '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
        dots + gridLines + xLabels +
      '</svg>';
  };

  /* ---------- Столбчатая гистограмма ---------- */
  Ch.bars = function (host, data, opts) {
    if (!host) return;
    opts = opts || {};
    var W = opts.width || 600, H = opts.height || 180;
    var pad = { t: 15, r: 15, b: 30, l: 38 };
    var pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    var maxV = opts.maxV || 100;
    var len = data.length;
    if (!len) { host.innerHTML = ''; return; }

    var bw = Math.max(8, Math.min(40, pw / len - 4));
    var gap = (pw - bw * len) / (len + 1);

    var bars = data.map(function (d, i) {
      var x = pad.l + gap + i * (bw + gap);
      var bh = (d.value / maxV) * ph;
      var y = pad.t + ph - bh;
      return '<g>' +
        '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="3" fill="var(--accent)" fill-opacity=".75">' +
          '<title>' + (U.esc(d.label || '') + ': ' + d.value + '%') + '</title></rect>' +
        '<text x="' + (x + bw/2) + '" y="' + (H - 6) + '" text-anchor="middle" fill="currentColor" fill-opacity=".35" font-size="9" font-family="var(--font-num)">' + U.esc((d.label || '').slice(0, 5)) + '</text>' +
      '</g>';
    }).join('');

    host.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block" preserveAspectRatio="none">' +
        bars +
      '</svg>';
  };

  /* ---------- Heatmap ---------- */
  Ch.heatmap = function (host, opts) {
    if (!host) return;
    opts = opts || {};
    var cells = opts.cells || [];
    var months = opts.months || [];
    var len = cells.length;
    if (!len) { host.innerHTML = ''; return; }

    var weekCount = Math.ceil(len / 7);
    var W = weekCount * 16 + 40;
    var H = weekCount > 20 ? 160 : 120;
    var padL = 40;
    var W2 = W - padL;

    var svgCells = cells.map(function (c, i) {
      var col = Math.floor(i / 7);
      var row = i % 7;
      var x = padL + col * 16;
      var y = 10 + row * 16;
      var l = c.value <= 1 ? '1' : c.value <= 2 ? '2' : c.value <= 3 ? '3' : '4';
      return '<rect x="' + x + '" y="' + y + '" width="12" height="12" rx="2" data-l="' + l + '" data-future="' + (c.future ? '1' : '0') + '">' +
        '<title>' + (U.esc(c.label || '') + ': ' + c.value + '%') + '</title></rect>';
    }).join('');

    /* x-метки месяцев */
    var xLabels = '';
    var prevM = -1;
    months.forEach(function (m, i) {
      var col = Math.floor(i / 7);
      if (m.label !== prevM) {
        xLabels += '<text x="' + (padL + col * 16 + 6) + '" y="8" text-anchor="middle" fill="currentColor" fill-opacity=".35" font-size="8" font-family="var(--font-num)">' + U.esc(m.label) + '</text>';
        prevM = m.label;
      }
    });

    host.innerHTML =
      '<div style="overflow-x:auto">' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block;min-width:' + (weekCount * 16 + 50) + 'px">' +
          svgCells + xLabels +
        '</svg>' +
      '</div>';
  };

  /* ---------- Donut / круговая метрика ---------- */
  Ch.donut = function (host, pct, size, color) {
    if (!host) return;
    size = size || 60;
    var r = (size - 8) / 2;
    var c = 2 * Math.PI * r;
    var off = c * (1 - pct / 100);
    host.innerHTML =
      '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
        '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="currentColor" stroke-opacity=".08" stroke-width="6"/>' +
        '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + (color || 'var(--accent)') + '" stroke-width="6" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '" stroke-linecap="round" transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')"/>' +
      '</svg>';
  };

  /* ---------- Sparkline ---------- */
  Ch.sparkline = function (host, data, w, h, color) {
    if (!host) return;
    w = w || 80; h = h || 24;
    var len = data.length;
    if (len < 2) { host.innerHTML = ''; return; }
    var max = Math.max.apply(null, data) || 1;
    var pts = data.map(function (v, i) {
      return (i / (len - 1)) * w + ',' + (h - (v / max) * h);
    }).join(' ');
    host.innerHTML =
      '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
        '<polyline points="' + pts + '" fill="none" stroke="' + (color || 'var(--accent)') + '" stroke-width="1.5" stroke-linecap="round"/>' +
      '</svg>';
  };

  App.charts = Ch;
})(window.App = window.App || {});

</script>
<script>
/* ==== js/ui/quickadd.js ==== */
/* ============================================================
   ВЕКТОР · UI: быстрое добавление (FAB + клавиатура)
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui;
  var Q = {};

  var CATS = ['Навыки','Бизнес','Здоровье','Развитие','Быт','Финансы','Отдых','Общее'];
  var open = false;

  function paint() {
    var root = U.$('#sheet-root');
    if (!root) return;
    if (!open) { root.innerHTML = ''; return; }
    root.innerHTML =
      '<div class="qm"><div class="qm-panel">' +
        '<button class="qm-item" data-a="task">' + I.icon('check', 18) + '<span>Задачу на сегодня</span><kbd>T</kbd></button>' +
        '<button class="qm-item" data-a="habit">' + I.icon('target', 18) + '<span>Привычку</span><kbd>H</kbd></button>' +
        '<button class="qm-item" data-a="goal">' + I.icon('flag', 18) + '<span>Цель</span><kbd>G</kbd></button>' +
        '<button class="qm-item" data-a="note">' + I.icon('book', 18) + '<span>Заметку</span><kbd>N</kbd></button>' +
      '</div></div>';
    U.$$('.qm-item', root).forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-a');
        Q.close();
        if (a === 'task') Q.openTask();
        if (a === 'habit') Q.openHabit();
        if (a === 'goal') Q.openGoal();
        if (a === 'note') Q.openNote();
      });
    });
    root.querySelector('.qm').addEventListener('click', function (e) {
      if (e.target.classList.contains('qm')) Q.close();
    });
  }

  Q.isOpen = function () { return open; };
  Q.show = function () { open = true; paint(); };
  Q.close = function () { open = false; paint(); };
  Q.toggle = function () { open = !open; paint(); };

  function goalOptions() {
    return [{ value: '', label: '— без цели' }].concat(
      S.state.goals.filter(function (g) { return g.status === 'active'; })
        .map(function (g) { return { value: g.id, label: g.title }; }));
  }

  /* ---------- Задача ---------- */
  Q.openTask = function (date, goalId) {
    Q.close();
    C.formModal([
      { name: 'title', label: 'Что сделать', required: true, span: 2, placeholder: 'Например: сверстать страницу продукта' },
      { name: 'category', label: 'Категория', type: 'select', value: 'Бизнес', options: CATS.map(function (c) { return { value: c, label: c }; }) },
      { name: 'minutes', label: 'Время, мин', type: 'number', value: 30, min: 0, step: 5 },
      { name: 'priority', label: 'Приоритет', type: 'select', value: 'mid',
        options: [{ value: 'high', label: 'Высокий' }, { value: 'mid', label: 'Средний' }, { value: 'low', label: 'Низкий' }] },
      { name: 'date', label: 'Дата', type: 'date', value: date || U.todayKey() },
      { name: 'goalId', label: 'Какой цели служит', type: 'select', value: goalId || '', options: goalOptions(), span: 2 }
    ], function (v) {
      S.addTask({
        title: v.title.trim(), category: v.category, minutes: Number(v.minutes) || 0,
        priority: v.priority, date: v.date, goalId: v.goalId || null
      });
      var a = App.stats.checkAchievements();
      a.forEach(function (x) { C.toast(x.icon + '  ' + x.name, 'ok', 4000); });
      C.toast('Задача добавлена', 'ok');
      App.router.render();
    }, 'Добавить задачу', { title: 'Новая задача', subtitle: 'Время + приоритет = честный процент дня' });
  };

  /* ---------- Привычка ---------- */
  Q.openHabit = function () {
    Q.close();
    C.formModal([
      { name: 'name', label: 'Название', required: true, span: 2, placeholder: 'Например: Английский' },
      { name: 'category', label: 'Категория', type: 'select', value: 'Навыки', options: CATS.map(function (c) { return { value: c, label: c }; }) },
      { name: 'minutes', label: 'Минут в день', type: 'number', value: 30, min: 0, step: 5 },
      { name: 'days', label: 'В какие дни', type: 'days', value: [1,2,3,4,5,6,0], span: 2 }
    ], function (v) {
      S.addHabit({
        name: v.name.trim(), category: v.category, minutes: Number(v.minutes) || 0,
        days: (v.days || '').split(',').map(Number).filter(function (n) { return !isNaN(n); })
      });
      C.toast('Привычка создана', 'ok');
      App.router.render();
    }, 'Создать привычку', { title: 'Новая привычка', subtitle: 'Отмечать можно в «Сегодня» и в календаре привычек' });
  };

  /* ---------- Цель ---------- */
  Q.openGoal = function () {
    Q.close();
    App.goals.newGoal();
  };

  /* ---------- Заметка ---------- */
  Q.openNote = function () {
    Q.close();
    C.formModal([
      { name: 'text', label: 'Заметка', type: 'textarea', rows: 4, required: true, span: 2, placeholder: 'Мысль, идея, договорённость…' },
      { name: 'tags', label: 'Теги', placeholder: 'через запятую' },
      { name: 'date', label: 'Дата', type: 'date', value: U.todayKey() }
    ], function (v) {
      S.addNote({ text: v.text.trim(), date: v.date, tags: v.tags ? v.tags.split(',').map(function (t) { return t.trim(); }).filter(Boolean) : [] });
      C.toast('Заметка сохранена', 'ok');
      App.router.render();
    }, 'Сохранить', { title: 'Быстрая заметка' });
  };

  /* ---------- Привязки ---------- */
  document.addEventListener('click', function (e) {
    var fab = e.target.closest && e.target.closest('#fab');
    if (fab) { Q.toggle(); return; }
    if (open && !e.target.closest('.qm')) Q.close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && open) Q.close();
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K' || e.key === 'л')) {
      e.preventDefault();
      Q.toggle();
    }
  });

  App.quickadd = Q;
})(window.App = window.App || {});

</script>
