    { name: 'month_win', label: 'Главная победа месяца', type: 'textarea', rows: 2 },
    { name: 'month_error', label: 'Главная ошибка', type: 'textarea', rows: 2 },
    { name: 'month_good', label: 'Что получилось в этом месяце?', type: 'textarea', rows: 2 },
    { name: 'month_bad', label: 'Что не получилось?', type: 'textarea', rows: 2 },
    { name: 'month_lesson', label: 'Главный урок месяца', type: 'textarea', rows: 2 },
    { name: 'month_change', label: 'Что сделаю иначе в новом месяце?', type: 'textarea', rows: 2 }
  ];

  var FIELD_MAP = { day: DAY_FIELDS, week: WEEK_FIELDS, month: MONTH_FIELDS };

  function open(scope, period) {
    var fields = FIELD_MAP[scope] || DAY_FIELDS;
    var key = scope + ':' + period;
    var existing = S.state.retros[key];
    var answers = existing ? existing.answers : {};
    var title = { day: 'Вечерняя рефлексия', week: 'Ретроспектива недели', month: 'Ретроспектива месяца' };
    C.formModal(fields, function (v) {
      S.saveRetro(scope, period, v);
      C.toast('Ретроспектива сохранена', 'ok');
      App.router.render();
    }, 'Сохранить', { title: title[scope] || 'Ретроспектива', subtitle: period, wide: true });
  }

  /* ======================= ЭКРАН ======================= */
  App.router.register({
    id: 'retro', title: 'Ретроспективы', icon: 'book', group: 'Анализ',

    render: function (host, params) {
      var scope = params.scope || 'day';
      var period = params.period || U.todayKey();

      var segItems = [{ value: 'day', label: 'Дни' }, { value: 'week', label: 'Недели' }, { value: 'month', label: 'Месяцы' }];
      var segHtml = C.segmented(segItems, scope);

      var retros = Object.keys(S.state.retros)
        .filter(function (k) { return k.indexOf(scope + ':') === 0; })
        .sort()
        .reverse()
        .slice(0, 60);

      var listHtml = retros.length
        ? '<div class="stack">' + retros.map(function (key) {
            var parts = key.split(':');
            var p = parts[1];
            var r = S.state.retros[key];
            var label = U.fmtDate(p);
            var fields = FIELD_MAP[scope] || DAY_FIELDS;
            var entries = fields.filter(function (f) { return r.answers[f.name]; }).slice(0, 2);
            return '<div class="retro-card">' +
              '<div class="retro-card-h">' + label +
                '<span class="text-3 text-xs">' + new Date(r.updatedAt).toLocaleDateString('ru') + '</span></div>' +
              entries.map(function (f) {
                return '<div><span class="text-xs text-3">' + U.esc(LABELS[f.name] || f.name) + '</span><p class="text-sm">' + U.esc(r.answers[f.name]) + '</p></div>';
              }).join('') +
              '<button class="btn btn--sm btn--ghost mt-1" data-act="edit-' + key + '">' + I.icon('edit', 12) + ' Изменить</button>' +
              '<button class="btn btn--sm btn--danger" data-act="del-' + key + '">Удалить</button>' +
            '</div>';
          }).join('') + '</div>'
        : C.empty('book', 'Ретроспектив ' + (scope === 'day' ? 'дней' : scope === 'week' ? 'недель' : 'месяцев') + ' нет',
            '<button class="btn btn--sm btn--primary" data-act="new">Создать первую</button>');

      host.innerHTML =
        '<div class="view-inner">' +
          '<div class="row items-center justify-between mb-4">' +
            segHtml +
            '<button class="btn btn--sm btn--primary" data-act="new">' + I.icon('plus', 14) + ' Новая</button>' +
          '</div>' +
          listHtml +
        '</div>';

      U.delegate(host, 'click', '[data-seg]', function () {
        App.router.go('retro', { scope: this.getAttribute('data-seg'), period: period });
      });
      U.delegate(host, 'click', '[data-act="new"]', function () { open(scope, period); });
      U.delegate(host, 'click', '[data-act^="edit-"]', function () {
        var key = this.getAttribute('data-act').replace('edit-', '');
        var parts = key.split(':');
        open(parts[0], parts[1]);
      });
      U.delegate(host, 'click', '[data-act^="del-"]', function () {
        var key = this.getAttribute('data-act').replace('del-', '');
        C.confirm('Удалить ретроспективу?', '', function () {
          delete S.state.retros[key]; S.save(); App.router.render();
        }, 'Удалить');
      });
    }
  });

  App.retro.open = open;
})(window.App = window.App || {});

</script>
<script>
/* ==== js/views/diary.js ==== */
/* ============================================================
   ВЕКТОР · Экран «ДНЕВНИК» — мысли по дням + заметки
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui;

  App.router.register({
    id: 'diary', title: 'Дневник', icon: 'book', group: 'Личное',

    render: function (host, params) {
      var tab = params.tab || 'thoughts';
      var mk = params.month || U.monthKey(U.todayKey());
      var sel = params.date || U.todayKey();
      var today = U.todayKey();

      /* ---------- Календарь мыслей ---------- */
      var first = U.monthStart(mk);
      var lead = (U.dow(first) + 6) % 7;
      var days = U.monthKeysList(mk);
      var calHead = U.DOW_LABEL.map(function (d) { return '<span class="cal-dow">' + d + '</span>'; }).join('');
      var blanks = '';
      for (var i = 0; i < lead; i++) blanks += '<span class="cal-day" data-blank="1"></span>';

      var calCells = days.map(function (k) {
        var has = !!S.state.thoughts[k];
        var cls = 'cal-day' + (has ? ' has' : '') + (k === sel ? ' sel' : '') + (k === today ? ' today' : '');
        return '<button class="' + cls + '" data-date="' + k + '">' + parseInt(k.slice(8), 10) + '</button>';
      }).join('');

      var thoughtText = S.state.thoughts[sel] || '';
      var count = Object.keys(S.state.thoughts).filter(function (k) { return k.slice(0, 7) === mk; }).length;

      var thoughtsHtml =
        '<div class="split">' +
          '<div class="card">' +
            '<div class="card-head">' +
              '<span class="card-title">' + I.icon('book', 15) + ' Мысли за ' + U.fmtMonth(mk) + '</span>' +
              '<span class="card-note">' + count + ' записей</span>' +
            '</div>' +
            '<div class="row row-tight mb-3">' +
              '<button class="icon-btn icon-btn--line" data-act="mprev">' + I.icon('chevL', 16) + '</button>' +
              '<b class="grow" style="text-align:center">' + U.fmtMonth(mk) + '</b>' +
              '<button class="icon-btn icon-btn--line" data-act="mnext">' + I.icon('chevR', 16) + '</button>' +
            '</div>' +
            '<div class="cal">' + calHead + blanks + calCells + '</div>' +
          '</div>' +
          '<div class="card">' +
            '<div class="card-head">' +
              '<span class="card-title">' + U.fmtLong(sel) + '</span>' +
              (sel === today ? '<span class="chip chip--accent">сегодня</span>' : '') +
            '</div>' +
            '<textarea class="textarea" id="th2" rows="8" placeholder="Запиши одну мысль этого дня…">' + U.esc(thoughtText) + '</textarea>' +
            '<p class="text-xs text-3 mt-2">Сохраняется автоматически. Мысль — это то, что ты хочешь вспомнить через год.</p>' +
            '<div class="mt-3">' +
              '<button class="btn btn--sm btn--primary" data-act="th-save">Сохранить</button>' +
              '<button class="btn btn--sm btn--danger" data-act="th-del">Удалить</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      /* ---------- Заметки ---------- */
      var q = (params.q || '').toLowerCase();
      var notes = S.state.notes.slice().sort(function (a, b) { return b.createdAt - a.createdAt; })
        .filter(function (n) { return !q || n.text.toLowerCase().indexOf(q) !== -1; });

      var notesHtml =
        '<div class="card mb-4">' +
          '<div class="quick-input">' +
            '<span class="text-3">' + I.icon('plus', 16) + '</span>' +
            '<input id="qn" placeholder="Быстрая заметка и Enter…">' +
          '</div>' +
        '</div>' +
        '<div class="notes">' +
          (notes.length ? notes.map(function (n) {
            return '<div class="note" data-id="' + n.id + '">' +
              '<div class="note-h"><span class="mono text-xs text-3">' + U.fmtDate(n.date) + ' · ' + new Date(n.createdAt).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }) + '</span>' +
                '<span class="grow"></span>' +
                '<button class="icon-btn" data-act="note-edit">' + I.icon('edit', 14) + '</button>' +
                '<button class="icon-btn" data-act="note-del">' + I.icon('trash', 14) + '</button></div>' +
              '<p>' + U.esc(n.text) + '</p>' +
              (n.tags && n.tags.length ? '<div class="row row-tight mt-1">' + n.tags.map(function (t) { return '<span class="chip">#' + U.esc(t) + '</span>'; }).join('') + '</div>' : '') +
            '</div>';
          }).join('') : C.empty('book', 'Заметок пока нет')) +
        '</div>';

      /* ---------- Сборка ---------- */
      host.innerHTML =
        '<div class="view-inner">' +
          '<div class="row items-center justify-between mb-4">' +
            C.segmented([{ value: 'thoughts', label: 'Мысль дня' }, { value: 'notes', label: 'Заметки' }], tab) +
            (tab === 'notes' ? '<input class="input" id="nq" placeholder="Поиск по заметкам…" value="' + U.esc(params.q || '') + '" style="max-width:220px">' : '') +
          '</div>' +
          (tab === 'thoughts' ? thoughtsHtml : notesHtml) +
        '</div>';

      /* ---------- События ---------- */
      U.delegate(host, 'click', '[data-seg]', function () {
        App.router.go('diary', { tab: this.getAttribute('data-seg'), month: mk, date: sel });
      });
      U.delegate(host, 'click', '.cal-day:not([data-blank])', function () {
        App.router.go('diary', { tab: 'thoughts', month: mk, date: this.getAttribute('data-date') });
      });
      U.delegate(host, 'click', '[data-act="mprev"]', function () {
        App.router.go('diary', { tab: 'thoughts', month: U.addMonths(mk, -1), date: sel }); });
      U.delegate(host, 'click', '[data-act="mnext"]', function () {
        App.router.go('diary', { tab: 'thoughts', month: U.addMonths(mk, 1), date: sel }); });

      var th2 = U.$('#th2', host);
      if (th2) {
        U.$('[data-act="th-save"]', host).addEventListener('click', function () {
          S.setThought(sel, th2.value);
          C.toast('Мысль сохранена', 'ok');
        });
        U.$('[data-act="th-del"]', host).addEventListener('click', function () {
          S.setThought(sel, ''); C.toast('Удалено', 'ok');
          App.router.go('diary', { tab: 'thoughts', month: mk, date: sel });
        });
        th2.addEventListener('input', U.debounce(function () { S.setThought(sel, th2.value); }, 800));
      }

      var qn = U.$('#qn', host);
      if (qn) qn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && this.value.trim()) {
          S.addNote({ text: this.value.trim(), date: today });
          App.router.render();
          setTimeout(function () { var x = U.$('#qn'); if (x) x.focus(); }, 30);
        }
      });
      var nq = U.$('#nq', host);
      if (nq) nq.addEventListener('input', U.debounce(function () {
        App.router.go('diary', { tab: 'notes', q: nq.value });
      }, 500));

      U.delegate(host, 'click', '[data-act="note-del"]', function () {
        var id = this.closest('.note').getAttribute('data-id');
        S.removeNote(id); App.router.render();
      });
      U.delegate(host, 'click', '[data-act="note-edit"]', function () {
        var id = this.closest('.note').getAttribute('data-id');
        var n = S.state.notes.find(function (x) { return x.id === id; });
        if (!n) return;
        C.formModal([
          { name: 'text', label: 'Текст', type: 'textarea', rows: 5, value: n.text, required: true, span: 2 },
          { name: 'date', label: 'Дата', type: 'date', value: n.date },
          { name: 'tags', label: 'Теги', value: (n.tags || []).join(', '), placeholder: 'через запятую' }
        ], function (v) {
          S.updateNote(id, { text: v.text.trim(), date: v.date, tags: v.tags ? v.tags.split(',').map(function (t) { return t.trim(); }).filter(Boolean) : [] });
          App.router.render();
        }, 'Сохранить', { title: 'Заметка' });
      });
    }
  });
})(window.App = window.App || {});

</script>
<script>
/* ==== js/views/analytics.js ==== */
/* ============================================================
   ВЕКТОР · Экран «АНАЛИТИКА»
   Все выводы считаются только из реальных данных пользователя.
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui, St = App.stats, Ch = App.charts;

  App.router.register({
    id: 'analytics', title: 'Аналитика', icon: 'chart', group: 'Анализ', mobile: false,

    render: function (host, params) {
      var range = Number(params.range) || 30;
      var today = U.todayKey();
      var from = U.addDays(today, -range + 1);
      var keys = U.rangeKeys(from, today);
      var snaps = keys.map(St.daySnapshot);
      var withData = snaps.filter(function (s) { return s.total > 0; });

      /* ---------- KPI ---------- */
      var tasksDone = U.sum(snaps, function (s) { return s.tasksDone; });
      var tasksTotal = U.sum(snaps, function (s) { return s.tasksTotal; });
      var habDone = U.sum(snaps, function (s) { return s.habitsDone; });
      var habTotal = U.sum(snaps, function (s) { return s.habitsTotal; });
      var avgPct = withData.length ? Math.round(U.mean(withData.map(function (s) { return s.pct; }))) : 0;
      var prodDays = withData.filter(function (s) { return s.pct >= (S.state.settings.dayTarget || 70); }).length;
      var hours = Math.round(U.sum(snaps, function (s) { return s.minDone; }) / 6 * 10) / 10;

      /* ---------- Инсайты ---------- */
      var ins = St.insights(range);
      var insHtml = ins.length
        ? '<div class="stack">' + ins.map(function (x) {
            return '<div class="insight"><span>' + x.icon + '</span><div>' + x.text + '</div></div>';
          }).join('') + '</div>'
        : C.empty('chart', 'Данных пока мало. Отметь несколько дней — и здесь появятся настоящие выводы.');

      /* ---------- Привычки: % ---------- */
      var hs = St.allHabitsStats(from, today).sort(function (a, b) { return b.pct - a.pct; });
      var habBars = hs.length
        ? '<div class="hbars">' + hs.map(function (h) {
            return '<div class="hbar">' +
              '<span class="hbar-n">' + U.esc(h.name) + '</span>' +
              '<div class="hbar-track">' + C.progress(h.pct, h.pct >= 80 ? 'ok' : h.pct < 40 ? 'warn' : '') + '</div>' +
              '<span class="hbar-v mono">' + h.done + '/' + h.planned + '</span>' +
              '<span class="hbar-p mono">' + h.pct + '%</span>' +
              '<span class="hbar-s mono" title="Текущая серия / рекорд">' + h.currentStreak + ' · ' + h.bestStreak + '</span>' +
            '</div>';
          }).join('') + '</div>'
        : C.empty('target', 'Привычек нет');

      /* ---------- Дни недели ---------- */
      var dowAgg = {};
      withData.forEach(function (s) {
        var d = U.dow(s.date);
        dowAgg[d] = dowAgg[d] || { sum: 0, n: 0 };
        dowAgg[d].sum += s.pct; dowAgg[d].n++;
      });
      var dowData = [1,2,3,4,5,6,0].map(function (d) {
        var a = dowAgg[d];
        return { label: U.DOW_LABEL[(d + 6) % 7], value: a ? Math.round(a.sum / a.n) : 0 };
      });

      /* ---------- Категории задач ---------- */
      var byCat = {};
      keys.forEach(function (k) {
        S.state.tasks.filter(function (t) { return t.date === k; }).forEach(function (t) {
          byCat[t.category] = byCat[t.category] || { done: 0, total: 0 };
          byCat[t.category].total++;
          if (t.done) byCat[t.category].done++;
        });
      });
      var catData = Object.keys(byCat).map(function (c) {
        return { label: c, value: U.pct(byCat[c].done, byCat[c].total), n: byCat[c] };
      }).sort(function (a, b) { return b.value - a.value; });

      /* ---------- Прогресс целей ---------- */
      var goals = S.state.goals.filter(function (g) { return g.status === 'active'; });
      var goalsHtml = goals.length
        ? '<div class="stack">' + goals.map(function (g) {
            var p = St.goalProgress(g.id);
            return '<div class="mini-goal">' +
              '<span class="grow">' + U.esc(g.title) + ' <em class="text-3 text-xs">' + U.esc(p.label || '') + '</em></span>' +
              '<span class="mono text-sm">' + p.pct + '%</span>' +
              C.progress(p.pct, p.pct >= 80 ? 'ok' : '') +
            '</div>';
          }).join('') + '</div>'
        : C.empty('flag', 'Активных целей нет');

      /* ---------- XP / уровни ---------- */
      var lvl = St.levelInfo();
      var xpByDay = {};
      (S.state.xp.log || []).forEach(function (e) {
        if (e.date >= from && e.date <= today) xpByDay[e.date] = (xpByDay[e.date] || 0) + e.amount;
      });
      var xpSeries = keys.map(function (k) { return { label: k.slice(8), value: xpByDay[k] || 0 }; });

      /* ---------- Достижения ---------- */
      var ach = St.achievementDefs();

      /* ---------- Сборка ---------- */
      host.innerHTML =
        '<div class="view-inner">' +
          '<div class="row items-center justify-between mb-4">' +
            '<b style="font-size:var(--fs-lg);letter-spacing:-.02em">За ' + range + ' ' + U.plural(range, ['день','дня','дней']) + '</b>' +
            C.segmented([{ value: 7, label: '7 дней' }, { value: 30, label: '30 дней' }, { value: 90, label: '90 дней' }, { value: 365, label: 'Год' }], String(range)) +
          '</div>' +

          '<div class="grid grid-4 mb-4">' +
            C.statTile('Средний % дня', avgPct + '%', '', avgPct >= 70) +
            C.statTile('Задач закрыто', tasksDone + ' / ' + tasksTotal, Math.round((tasksTotal - tasksDone)) + ' пропущено') +
            C.statTile('Привычки', habTotal ? U.pct(habDone, habTotal) + '%' : '—', habDone + ' / ' + habTotal) +
            C.statTile('Продуктивных дней', prodDays + ' / ' + withData.length, hours + ' ч сфокусировано', true) +
          '</div>' +

          '<div class="split">' +
            '<div class="col">' +
              C.card({ title: 'Выполнение по дням', icon: 'chart', note: 'задачи + привычки, %' },
                '<div id="a1"></div>' +
                (withData.length < 3 ? '<p class="text-xs text-3 mt-2">Мало данных — отметь пару дней.</p>' : '')) +
              C.card({ title: 'Выполнение привычек', icon: 'target' }, habBars) +
              C.card({ title: 'Продуктивность по дням недели', icon: 'cal', note: 'средний % выполнения' },
                '<div id="a2"></div>') +
              C.card({ title: 'Активность по месяцам', icon: 'layers', note: 'последние 12 месяцев' },
                '<div id="a3"></div>') +
            '</div>' +
            '<div class="col">' +
              C.card({ title: 'Выводы', icon: 'zap', note: 'только из твоих данных' }, insHtml) +
              C.card({ title: 'Уровень и XP', icon: 'star', note: 'всего ' + lvl.xp + ' XP' },
                '<div class="row items-center gap-2 mb-3">' + C.ring(lvl.pct, 62, 6) +
                  '<div><div style="font-size:var(--fs-xl);font-weight:750">Level ' + lvl.level + '</div>' +
                  '<div class="text-xs text-3">' + lvl.xp + ' / ' + lvl.next + ' XP до следующего</div></div>' +
                '</div>' +
                '<div id="a4"></div>' +
                '<p class="text-xs text-3 mt-2">XP: задача +10, важная задача +20, привычка +20, цель +50, закрытый день +30.</p>') +
              C.card({ title: 'Прогресс целей', icon: 'flag' }, goalsHtml) +
              C.card({ title: 'Категории задач', icon: 'layers', note: '% выполнения за период' },
                catData.length ? '<div class="hbars">' + catData.map(function (c) {
                  return '<div class="hbar">' +
                    '<span class="hbar-n">' + U.esc(c.label) + '</span>' +
                    '<div class="hbar-track">' + C.progress(c.value) + '</div>' +
                    '<span class="hbar-p mono">' + c.value + '%</span>' +
                    '<span class="hbar-v mono">' + c.n.done + '/' + c.n.total + '</span></div>';
                }).join('') + '</div>' : C.empty('layers', 'Задач за период нет')) +
            '</div>' +
          '</div>' +

          '<div class="card mt-4">' +
            '<div class="card-head"><span class="card-title">' + I.icon('award', 15) + ' Достижения</span>' +
              '<span class="card-note">' + ach.filter(function (a) { return a.done; }).length + ' / ' + ach.length + '</span></div>' +
            '<div class="ach-grid">' + ach.map(function (a) {
              return '<div class="ach' + (a.done ? ' on' : '') + '">' +
                '<span class="ach-ic">' + a.icon + '</span>' +
                '<div><div class="ach-t">' + U.esc(a.name) + '</div><div class="ach-d">' + U.esc(a.desc) + '</div></div>' +
              '</div>';
            }).join('') + '</div>' +
          '</div>' +
        '</div>';

      /* ---------- Графики ---------- */
      Ch.line(U.$('#a1', host), snaps.map(function (s) {
        return { label: s.date.slice(8), date: s.date, pct: s.total ? s.pct : null };
      }).filter(function (d) { return d.pct !== null; }), { height: 190 });

      Ch.bars(U.$('#a2', host), dowData, { height: 150, maxV: 100 });

      Ch.bars(U.$('#a3', host), St.monthlyPctSeries(12).map(function (m) {
        return { label: m.label, value: m.pct };
      }), { height: 150, maxV: 100 });

      Ch.bars(U.$('#a4', host), xpSeries.slice(-14), { height: 90, maxV: Math.max(60, Math.max.apply(null, xpSeries.map(function (x) { return x.value; })) || 60) });

      /* ---------- События ---------- */
      U.delegate(host, 'click', '[data-seg]', function () {
        App.router.go('analytics', { range: this.getAttribute('data-seg') });
      });
    }
  });
})(window.App = window.App || {});

</script>
<script>
/* ==== js/views/settings.js ==== */
/* ============================================================
   ВЕКТОР · Экран «НАСТРОЙКИ» + экспорт/импорт
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui, St = App.stats;

  var CATS = ['Навыки','Бизнес','Здоровье','Развитие','Быт','Финансы','Отдых','Общее'];

  /* ---------- Демо-данные для проверки механик ---------- */
  function seedDemo(days) {
    var today = U.todayKey();
    var habits = [
      { name: 'Английский', category: 'Навыки', minutes: 30, rate: 0.86 },
      { name: 'Дикция', category: 'Навыки', minutes: 15, rate: 0.7 },
      { name: 'Спорт', category: 'Здоровье', minutes: 45, rate: 0.55 },
      { name: 'Чтение', category: 'Развитие', minutes: 30, rate: 0.62 },
      { name: 'Готовка', category: 'Быт', minutes: 40, rate: 0.75 },
      { name: 'Работа над бизнесом', category: 'Бизнес', minutes: 120, rate: 0.8 },
      { name: 'Сон вовремя', category: 'Здоровье', minutes: 0, rate: 0.48 }
    ];
    var created = [];
    habits.forEach(function (h) {
      S.addHabit({ name: h.name, category: h.category, minutes: h.minutes, log: {}, createdAt: U.addDays(today, -days) });
      created.push(S.state.habits[S.state.habits.length - 1]);
    });
    created.forEach(function (h, hi) {
      U.rangeKeys(U.addDays(today, -days), U.addDays(today, -1)).forEach(function (k) {
        var bias = 0.12 * Math.sin(U.diffDays(U.addDays(today, -days), k) / 3 + hi);
        if (Math.random() < h.rate + bias) h.log[k] = true;
      });
    });

    var tpls = [
      ['Сверстать страницу продукта', 'Бизнес', 120, 'high'],
      ['Разобрать 10 возражений клиентов', 'Бизнес', 30, 'mid'],
      ['Созвон с первым клиентом', 'Бизнес', 30, 'high'],
      ['Выучить 20 слов', 'Навыки', 20, 'low'],
      ['Записать видео-визитку', 'Навыки', 40, 'mid'],
      ['План недели', 'Развитие', 15, 'mid'],
      ['Разобрать метрики', 'Финансы', 30, 'low']
    ];
    U.rangeKeys(U.addDays(today, -days), today).forEach(function (k) {
      var n = 2 + Math.floor(Math.random() * 3);
      for (var i = 0; i < n; i++) {
        var t = tpls[Math.floor(Math.random() * tpls.length)];
        var done = k < today ? Math.random() < 0.68 : false;
        S.state.tasks.push({
          id: U.uid(), title: t[0], category: t[1], minutes: t[2], priority: t[3],
          date: k, goalId: null, done: done, doneAt: done ? Date.now() : null, createdAt: Date.now()
        });
      }
    });

    U.rangeKeys(U.addDays(today, -Math.min(days, 40)), today).forEach(function (k, i) {
      if (i % 7 === 3) S.state.thoughts[k] = 'Демо-мысль: один шаг лучше нуля.';
    });

    S.save();
    C.toast('Демо-данные за ' + days + ' дн. загружены', 'ok');
    App.router.render();
  }

  /* ---------- Импорт ---------- */
  function importFlow() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.onchange = function () {
      var f = inp.files[0];
      if (!f) return;
      U.readText(f).then(function (txt) {
        if (S.importData(txt)) {
          C.toast('Данные импортированы', 'ok');
          App.theme.apply();
          App.router.render();
        } else {
          C.toast('Файл повреждён или не подходит', 'bad', 4000);
        }
      });
    };
    inp.click();
  }

  /* ======================= ЭКРАН ======================= */
  App.router.register({
    id: 'settings', title: 'Настройки', icon: 'more', group: 'Личное',

    render: function (host) {
      var s = S.state.settings;
      var size = 0;
      try { size = (localStorage.getItem(S.KEY) || '').length; } catch (e) {}

      var counts = [
        ['Задач', S.state.tasks.length], ['Привычек', S.state.habits.length],
        ['Целей', S.state.goals.length], ['Ретроспектив', Object.keys(S.state.retros).length],
        ['Мыслей', Object.keys(S.state.thoughts).length], ['Заметок', S.state.notes.length]
      ];

      host.innerHTML =
        '<div class="view-inner" style="max-width:820px">' +

          C.card({ title: 'Профиль', icon: 'star' },
            '<div class="form-grid">' +
              '<div class="field"><label>Как к тебе обращаться</label>' +
                '<input class="input" id="sname" value="' + U.esc(s.name || '') + '" placeholder="Имя"></div>' +
              '<div class="field"><label>Порог «продуктивный день», %</label>' +
                '<input class="input" id="starget" type="number" min="10" max="100" value="' + (s.dayTarget || 70) + '">' +
                '<span class="hint">От этого зависит серия (streak)</span></div>' +
            '</div>' +
            '<div class="mt-3"><button class="btn btn--sm btn--primary" id="saveprof">Сохранить</button></div>') +

          '<div class="grid grid-2 mt-4">' +
            C.card({ title: 'Тема', icon: 'moon' },
              C.segmented([{ value: 'dark', label: '🌙 Тёмная' }, { value: 'light', label: '☀️ Светлая' }], s.theme) +
              '<div class="modal-sec">Акцент</div>' +
              C.segmented([
                { value: 'indigo', label: 'Индиго' }, { value: 'teal', label: 'Бирюза' },
                { value: 'amber', label: 'Янтарь' }, { value: 'rose', label: 'Роза' }, { value: 'moss', label: 'Мох' }
              ], s.accent)) +

            C.card({ title: 'Данные', icon: 'layers', note: 'в браузере: ~' + Math.max(1, Math.round(size / 1024)) + ' КБ' },
              '<div class="stack">' +
                '<button class="btn btn--sm" id="exp">' + I.icon('plus', 14) + ' Экспортировать JSON</button>' +
                '<button class="btn btn--sm" id="imp">Импортировать JSON</button>' +
                '<button class="btn btn--sm btn--quiet" id="demo30">Загрузить демо-данные (30 дней)</button>' +
                '<button class="btn btn--sm btn--quiet" id="demo180">Демо за 180 дней — для графиков</button>' +
                '<button class="btn btn--sm btn--danger" id="wipe">Стереть всё</button>' +
              '</div>') +
          '</div>' +

          C.card({ title: 'Что уже есть', icon: 'check' },
            '<div class="grid grid-3">' + counts.map(function (c) {
              return C.statTile(c[0], c[1]);
            }).join('') + '</div>') +

          C.card({ title: 'Как это устроено', icon: 'book' },
            '<div class="howto">' +
              '<p><b>Данные.</b> Всё лежит в localStorage под ключом <code>vector.v1</code>. Бэкенда нет: чистка данных браузера = потеря данных, поэтому делай экспорт.</p>' +
              '<p><b>Прогресс дня</b> = (выполненные задачи + выполненные привычки) ÷ (все запланированные). Вес одинаковый, чтобы день был честным.</p>' +
              '<p><b>Серия</b> растёт, если день закрыт не ниже порога «продуктивный день». Пустые дни (без плана) серию не ломают.</p>' +
              '<p><b>Прогресс цели</b> считается по цепочке: измерение → дочерние цели → связанные задачи → ручной %. Поэтому большую цель достаточно разбить на шаги, и процент посчитается сам.</p>' +
              '<p><b>Где менять:</b> привычки — экран «Привычки», цели — «Цели», цвета и пороги — этот экран, весь дизайн — файл <code>styles/tokens.css</code>.</p>' +
            '</div>') +
        '</div>';

      /* ---------- События ---------- */
      U.$('#saveprof', host).addEventListener('click', function () {
        S.set(function (st) {
          st.settings.name = U.$('#sname', host).value.trim();
          st.settings.dayTarget = U.clamp(Number(U.$('#starget', host).value) || 70, 10, 100);
        });
        C.toast('Настройки сохранены', 'ok');
        App.router.render();
      });

      U.delegate(host, 'click', '[data-seg]', function () {
        var v = this.getAttribute('data-seg');
        var parent = this.closest('.seg');
        var isTheme = this.textContent.indexOf('Тёмная') !== -1 || this.textContent.indexOf('Светлая') !== -1;
        U.$$('.seg-btn', parent).forEach(function (b) { b.classList.remove('active'); });
        this.classList.add('active');
        if (isTheme) App.theme.setTheme(v);
        else App.theme.setAccent(v);
      });

      U.$('#exp', host).addEventListener('click', function () {
        U.download('vector-backup-' + U.todayKey() + '.json', S.exportJSON());
        C.toast('Файл сохранён', 'ok');
      });
      U.$('#imp', host).addEventListener('click', function () {
        C.confirm('Импортировать данные?', 'Текущие данные будут заменены содержимым файла.', importFlow, 'Выбрать файл');
      });
      U.$('#demo30', host).addEventListener('click', function () { seedDemo(30); });
      U.$('#demo180', host).addEventListener('click', function () { seedDemo(180); });
      U.$('#wipe', host).addEventListener('click', function () {
        C.confirm('Стереть все данные?', 'Это удалит задачи, привычки, цели, статистику и ретроспективы. Отменить нельзя.', function () {
          S.resetAll();
          C.toast('Данные стёрты', 'ok');
          App.router.go('today');
        }, 'Стереть');
      });
    }
  });

  App.settings = { seedDemo: seedDemo };
})(window.App = window.App || {});

</script>
<!-- Сборка -->
<script>
/* ==== js/app.js ==== */
/* ============================================================
   ВЕКТОР · сборка: тема, навигация, онбординг, старт
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui, St = App.stats;

  /* ================= ТЕМА ================= */
  var Theme = {
    apply: function () {
      var s = S.state.settings;
      document.documentElement.setAttribute('data-theme', s.theme || 'dark');
      document.documentElement.setAttribute('data-accent', s.accent || 'indigo');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', s.theme === 'light' ? '#f5f5f3' : '#0d0e11');
    },
    setTheme: function (t) {
      S.set(function (st) { st.settings.theme = t; });
      Theme.apply();
      C.toast(t === 'light' ? '☀️ Светлая тема' : '🌙 Тёмная тема', 'accent', 1600);
    },
    setAccent: function (a) {
      S.set(function (st) { st.settings.accent = a; });
      Theme.apply();
    },
    toggle: function () {
      Theme.setTheme(S.state.settings.theme === 'dark' ? 'light' : 'dark');
    }
  };
  App.theme = Theme;

  /* ================= НАВИГАЦИЯ ================= */
  var GROUP_ORDER = ['День', 'Планирование', 'Анализ', 'Личное'];

  function buildNav() {
    var routes = App.router.routes;
    var groups = {};
    routes.forEach(function (r) {
      if (!r.id) return;
      var g = r.group || 'Прочее';
      (groups[g] = groups[g] || []).push(r);
    });

    var side = U.$('#sideNav');
    if (side) {
      side.innerHTML = GROUP_ORDER.map(function (g) {
        if (!groups[g]) return '';
        return '<div class="nav-group"><div class="nav-label">' + g + '</div>' +
          groups[g].map(function (r) {
            return '<button class="nav-item" data-route="' + r.id + '">' + I.icon(r.icon, 18) + '<span>' + U.esc(r.title) + '</span></button>';
          }).join('') + '</div>';
      }).join('');
      U.delegate(side, 'click', '.nav-item', function () {
        App.router.go(this.getAttribute('data-route'));
      });
    }

    /* мобильные табы: 4 экрана + «Ещё» */
    var tabs = U.$('#tabs');
    if (tabs) {
      var main = routes.filter(function (r) { return r.mobile; }).slice(0, 4);
      tabs.innerHTML = '<div class="tabs-inner">' +
        main.map(function (r) {
          return '<button class="tab-item" data-route="' + r.id + '">' + I.icon(r.icon, 22) + '<span>' + U.esc(r.title) + '</span></button>';
        }).join('') +
        '<button class="tab-item" data-route="__more">' + I.icon('menu', 22) + '<span>Ещё</span></button>' +
      '</div>';
      U.delegate(tabs, 'click', '.tab-item', function () {
        var id = this.getAttribute('data-route');
        if (id === '__more') return openMore();
        App.router.go(id);
      });
    }

    /* футер сайдбара: уровень + XP */
    var foot = U.$('#sideFoot');
    if (foot) foot.innerHTML = '<div id="sideLevel"></div>';

    var mb = U.$('#menuBtn');
    if (mb) { mb.innerHTML = I.icon('menu', 18); mb.addEventListener('click', openMore); }

    var fab = U.$('#fab');
    if (fab) fab.innerHTML = I.icon('plus', 24);
  }

  function openMore() {
    var routes = App.router.routes;
    C.modal({
      title: 'Все разделы',
      body: '<div class="stack">' + routes.map(function (r) {
        return '<button class="qm-item" data-route="' + r.id + '">' + I.icon(r.icon, 18) +
          '<span>' + U.esc(r.title) + '</span><em class="text-3 text-xs">' + U.esc(r.group || '') + '</em></button>';
      }).join('') + '</div>',
      onMount: function (el, api) {
        U.$$('[data-route]', el).forEach(function (b) {
          b.addEventListener('click', function () { api.close(); App.router.go(b.getAttribute('data-route')); });
        });
      }
    });
  }

  function updateSideLevel() {
    var el = U.$('#sideLevel');
    if (!el) return;
    var lvl = St.levelInfo();
    el.innerHTML =
      '<div class="side-lvl">' +
        '<span class="side-lvl-n">' + lvl.level + '</span>' +
        '<div class="grow"><div class="bar bar--thin"><div class="bar-fill" style="width:' + lvl.pct + '%"></div></div>' +
        '<div class="side-lvl-x">' + lvl.xp + ' / ' + lvl.next + ' XP</div></div>' +
      '</div>';
  }

  /* ================= ОНБОРДИНГ ================= */
  function seed() {
    var today = U.todayKey();
    var s = S.state;

    var hIds = {};
    [
      { name: 'Английский', category: 'Навыки', minutes: 30 },
      { name: 'Дикция', category: 'Навыки', minutes: 15 },
      { name: 'Спорт', category: 'Здоровье', minutes: 45 },
      { name: 'Чтение', category: 'Развитие', minutes: 30 },
      { name: 'Готовка', category: 'Быт', minutes: 40 },
      { name: 'Работа над бизнесом', category: 'Бизнес', minutes: 120 },
      { name: 'Сон вовремя', category: 'Здоровье', minutes: 0 }
    ].forEach(function (h) {
      S.addHabit(h);
      hIds[h.name] = s.habits[s.habits.length - 1].id;
    });

    var gYear = 'Создать свой AI-продукт';
    S.addGoal({ title: gYear, desc: 'Первый рабочий продукт, который приносит деньги.', horizon: 'year', priority: 'high', deadline: today.slice(0, 4) + '-12-31' });
    var yearId = s.goals[s.goals.length - 1].id;

    S.addGoal({ title: 'Выйти на доход 150 000 ₽ в месяц', horizon: 'year', priority: 'high', deadline: today.slice(0, 4) + '-12-31',
      metric: { target: 150000, unit: '₽/мес', current: 0 } });
    var moneyId = s.goals[s.goals.length - 1].id;

    S.addGoal({ title: 'Английский до Upper-Intermediate', horizon: 'year', priority: 'mid',
      metric: { target: 300, unit: 'часов практики', current: 0 } });
    var engId = s.goals[s.goals.length - 1].id;

    S.addGoal({ title: 'Запустить первую версию продукта', desc: 'Публичная страница + первый платёж.', horizon: 'month', parentId: yearId, priority: 'high', deadline: U.addMonths(U.monthKey(today), 1) + '-01' });
    var monthId = s.goals[s.goals.length - 1].id;

    S.addGoal({ title: 'Провести 5 разговоров с клиентами', horizon: 'month', parentId: yearId, priority: 'mid', deadline: U.addMonths(U.monthKey(today), 1) + '-01' });
    var callsId = s.goals[s.goals.length - 1].id;

    S.addGoal({ title: 'Сделать первую рабочую версию', horizon: 'week', parentId: monthId, priority: 'high', deadline: U.addDays(U.mondayOf(today), 6) });
    var weekId = s.goals[s.goals.length - 1].id;

    S.addGoal({ title: 'Сверстать страницу продукта', horizon: 'day', parentId: weekId, priority: 'high', deadline: today });
    var dayId = s.goals[s.goals.length - 1].id;

    S.setPriorities([yearId, moneyId, engId]);

    [
      { title: 'Английский — 30 минут', category: 'Навыки', minutes: 30, priority: 'mid', goalId: engId, habitId: hIds['Английский'] },
      { title: 'Дикция — 15 минут', category: 'Навыки', minutes: 15, priority: 'low', habitId: hIds['Дикция'] },
      { title: 'Вайбкодинг — 2 часа', category: 'Бизнес', minutes: 120, priority: 'high', goalId: dayId },
      { title: 'Продажи — 30 минут', category: 'Бизнес', minutes: 30, priority: 'high', goalId: callsId },
      { title: 'Сверстать лендинг продукта', category: 'Бизнес', minutes: 90, priority: 'high', goalId: dayId }
    ].forEach(function (t) { S.addTask(t); });

    s.meta.onboarded = true;
    S.save();
  }

  function onboarding() {
    C.modal({
      title: 'Добро пожаловать в Вектор',
      subtitle: 'Личный центр управления жизнью. Всё хранится только в твоём браузере.',
      wide: true,
      body:
        '<div class="onb">' +
          '<p class="text-sm text-2">Три варианта старта:</p>' +
          '<button class="qm-item" data-o="demo"><span class="ach-ic">⚡</span><span><b>Начать с примера</b><br>' +
            '<span class="text-xs text-3">7 привычек, дерево целей «год → месяц → неделя → сегодня», задачи на сегодня. Так сразу видно, как считается прогресс.</span></span></button>' +
          '<button class="qm-item" data-o="clean"><span class="ach-ic">🌱</span><span><b>Чистый старт</b><br>' +
            '<span class="text-xs text-3">Пустое приложение. Добавь первую привычку и задачу через кнопку «+».</span></span></button>' +
          '<button class="qm-item" data-o="full"><span class="ach-ic">📊</span><span><b>Пример + история за 90 дней</b><br>' +
            '<span class="text-xs text-3">Демо-данные, чтобы сразу увидеть heatmap, streak и все графики в аналитике.</span></span></button>' +
          '<p class="text-xs text-3 mt-2">Любой вариант можно сбросить в разделе «Настройки». Экспорт JSON — страховка от потери данных.</p>' +
        '</div>',
      actions: '',
      onMount: function (el, api) {
        U.$$('[data-o]', el).forEach(function (b) {
          b.addEventListener('click', function () {
            var mode = b.getAttribute('data-o');
            api.close();
            if (mode === 'clean') { S.state.meta.onboarded = true; S.save(); }
            else {
              seed();
              if (mode === 'full') App.settings.seedDemo(90);
            }
            App.router.render();
            C.toast(mode === 'clean' ? 'Пустой старт — жми «+»' : 'Пример загружен', 'ok');
          });
        });
      }
    });
  }

  /* ================= СТАРТ ================= */
  function boot() {
    S.init();
    Theme.apply();

    /* подписка: любое изменение → пересчёт достижений + боковой уровень */
    S.subscribe(function () { updateSideLevel(); });

    buildNav();
    App.router.start();
    updateSideLevel();

    if (!S.state.meta.onboarded) onboarding();

    /* горячие клавиши */
    document.addEventListener('keydown', function (e) {
      if (e.target.matches('input,textarea,select')) return;
      if (e.key === 't') { App.quickadd.openTask(); }
      if (e.key === 'h') { App.quickadd.openHabit(); }
      if (e.key === 'g') { App.quickadd.openGoal(); }
      if (e.key === 'n') { App.quickadd.openNote(); }
      if (e.key === 'd') { App.router.go('today'); }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.App = window.App || {});

</script>
</body>
</html>
