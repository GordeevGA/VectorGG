<script>
/* ==== js/views/today.js ==== */
/* ============================================================
   ВЕКТОР · Экран «СЕГОДНЯ» — главный дашборд
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui, St = App.stats;

  var CATS = ['Навыки', 'Бизнес', 'Здоровье', 'Развитие', 'Быт', 'Финансы', 'Отдых'];

  /* ---------- Строка задачи ---------- */
  function taskRow(t) {
    return '<div class="task' + (t.done ? ' task--done' : '') + '" data-id="' + t.id + '">' +
      '<span class="task-prio" data-p="' + t.priority + '"></span>' +
      '<button class="check" role="checkbox" aria-checked="' + !!t.done + '" aria-label="Выполнено: ' + U.esc(t.title) + '" data-act="task-toggle">' + I.icon('check') + '</button>' +
      '<div class="task-main">' +
        '<div class="task-title">' + U.esc(t.title) + '</div>' +
        '<div class="task-meta">' +
          C.chipCat(t.category) +
          (t.minutes ? C.clock(t.minutes) : '') +
          C.chipPrio(t.priority) +
          (t.goalId ? goalChip(t.goalId) : '') +
        '</div>' +
      '</div>' +
      '<div class="task-tools">' +
        '<button class="icon-btn" data-act="task-edit" aria-label="Изменить">' + I.icon('edit', 15) + '</button>' +
        '<button class="icon-btn" data-act="task-del" aria-label="Удалить">' + I.icon('trash', 15) + '</button>' +
      '</div>' +
    '</div>';
  }

  function goalChip(goalId) {
    var g = S.state.goals.find(function (x) { return x.id === goalId; });
    if (!g) return '';
    return '<span class="chip chip--accent">' + I.icon('target', 11) + U.esc(g.title) + '</span>';
  }

  /* ---------- Строка привычки ---------- */
  function habitRow(h, date) {
    var done = !!(h.log && h.log[date]);
    var hs = St.habitStats(h, U.addDays(date, -29), date);
    return '<div class="task' + (done ? ' task--done' : '') + '" data-id="' + h.id + '">' +
      '<button class="check" role="checkbox" aria-checked="' + done + '" aria-label="Привычка: ' + U.esc(h.name) + '" data-act="hab-toggle">' + I.icon('check') + '</button>' +
      '<div class="task-main">' +
        '<div class="task-title">' + U.esc(h.name) + '</div>' +
        '<div class="task-meta">' +
          C.chipCat(h.category) +
          (h.minutes ? C.clock(h.minutes) : '') +
          (hs.currentStreak > 1 ? '<span class="chip chip--accent">' + I.icon('flame', 11) + hs.currentStreak + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="task-tools">' +
        '<button class="icon-btn" data-act="hab-edit" aria-label="Изменить">' + I.icon('edit', 15) + '</button>' +
      '</div>' +
    '</div>';
  }

  /* ---------- Редактирование задачи ---------- */
  function editTask(t) {
    C.formModal([
      { name: 'title', label: 'Название', value: t.title, required: true, span: 2 },
      { name: 'category', label: 'Категория', type: 'select', value: t.category,
        options: CATS.map(function (c) { return { value: c, label: c }; }) },
      { name: 'minutes', label: 'Время, мин', type: 'number', value: t.minutes, min: 0, step: 5 },
      { name: 'priority', label: 'Приоритет', type: 'select', value: t.priority,
        options: [{ value: 'high', label: 'Высокий' }, { value: 'mid', label: 'Средний' }, { value: 'low', label: 'Низкий' }] },
      { name: 'date', label: 'Дата', type: 'date', value: t.date },
      { name: 'goalId', label: 'Связанная цель', type: 'select', value: t.goalId || '',
        options: [{ value: '', label: '— не привязывать' }].concat(
          S.state.goals.filter(function (g) { return g.status !== 'archived'; })
            .map(function (g) { return { value: g.id, label: g.title }; })) }
    ], function (v) {
      S.updateTask(t.id, {
        title: v.title.trim(), category: v.category, minutes: Number(v.minutes) || 0,
        priority: v.priority, date: v.date, goalId: v.goalId || null
      });
      C.toast('Задача обновлена', 'ok');
      App.router.render();
    }, 'Сохранить', { title: 'Задача', subtitle: t.title });
  }

  /* ---------- Закрытие дня ---------- */
  function closeDayFlow(date) {
    var snap = St.daySnapshot(date);
    var streak = St.overallStreak();
    var topGoal = S.state.goals.filter(function (g) { return g.status === 'active'; })[0];
    var goalTxt = topGoal ? St.goalProgress(topGoal.id).pct + '% по цели «' + topGoal.title + '»' : 'Цели на сегодня нет';

    var prep =
      '<div class="daysum">' +
        '<div class="daysum-row"><span>Выполнено</span><b>' + snap.done + ' / ' + snap.total + '</b></div>' +
        '<div class="daysum-row"><span>Прогресс дня</span><b>' + snap.pct + '%</b></div>' +
        '<div class="daysum-row"><span>Привычки</span><b>' + snap.habitsDone + ' / ' + snap.habitsTotal + '</b></div>' +
        '<div class="daysum-row"><span>Время</span><b>' + U.minutesToHm(snap.minDone) + '</b></div>' +
        '<div class="daysum-row"><span>Серия</span><b>' + streak + ' ' + U.plural(streak, ['день','дня','дней']) + '</b></div>' +
        '<div class="daysum-row"><span>' + I.icon('target', 13) + '</span><b class="text-2">' + U.esc(goalTxt) + '</b></div>' +
      '</div>';

    C.formModal([
      { name: 'good', label: 'Что сегодня получилось?', type: 'textarea', rows: 2, placeholder: 'Минимум одна победа' },
      { name: 'bad', label: 'Что не получилось?', type: 'textarea', rows: 2, placeholder: 'Честно, без самобичевания' },
      { name: 'lesson', label: 'Что я понял?', type: 'textarea', rows: 2, placeholder: 'Вывод' },
      { name: 'tomorrow', label: 'Что завтра сделаю иначе?', type: 'textarea', rows: 2, placeholder: 'Одно конкретное действие' }
    ], function (v) {
      S.saveRetro('day', date, v);
      S.closeDay(date, { score: snap.pct, retro: true });
      var newAch = St.checkAchievements();
      newAch.forEach(function (a) { C.toast(a.icon + '  ' + a.name, 'ok', 4000); });
      C.toast('День закрыт. +30 XP', 'ok');
      App.router.render();
    }, 'Закрыть день', { title: 'Итоги дня', subtitle: U.fmtLong(date), prepend: prep });
  }

  /* ======================= ЭКРАН ======================= */
  App.router.register({
    id: 'today', title: 'Сегодня', icon: 'sun', group: 'День', mobile: true,

    render: function (host, params) {
      var date = params.date || U.todayKey();
      var snap = St.daySnapshot(date);
      var streak = St.overallStreak();
      var best = St.bestStreak();
      var lvl = St.levelInfo();
      var isToday = date === U.todayKey();

      var undone = snap.tasks.filter(function (t) { return !t.done; });
      var done = snap.tasks.filter(function (t) { return t.done; });

      /* --- ШАПКА ДНЯ --- */
      var hour = new Date().getHours();
      var hello = hour < 5 ? 'Доброй ночи' : hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
      var name = S.state.settings.name ? ', ' + U.esc(S.state.settings.name) : '';

      var hero =
        '<div class="hero card">' +
          '<div class="hero-l">' +
            '<div class="hero-date">' +
              '<button class="icon-btn icon-btn--line" data-act="day-prev" aria-label="Предыдущий день">' + I.icon('chevL', 16) + '</button>' +
              '<div class="hero-date-txt">' +
                '<b>' + (isToday ? 'Сегодня' : U.isFuture(date) ? 'Завтра' : 'Прошлое') + '</b>' +
                '<span>' + U.fmtLong(date) + '</span>' +
              '</div>' +
              '<button class="icon-btn icon-btn--line" data-act="day-next" ' + (date >= U.todayKey() ? 'disabled' : '') + ' aria-label="Следующий день">' + I.icon('chevR', 16) + '</button>' +
              (!isToday ? '<button class="btn btn--sm btn--ghost" data-act="day-today">Сегодня</button>' : '') +
            '</div>' +
            '<h2 class="hero-h">' + hello + name + '</h2>' +
            '<p class="hero-p">Прогресс дня: <b>' + snap.pct + '%</b> · ' +
              (snap.total ? snap.done + ' из ' + snap.total + ' выполнено' : 'план на день пуст') + '</p>' +
            '<div class="hero-metrics">' +
              '<div class="hm"><span>Серия</span><b>' + streak + ' <i>' + U.plural(streak, ['день','дня','дней']) + '</i></b>' +
                '<em>рекорд ' + best + '</em></div>' +
              '<div class="hm"><span>Уровень</span><b>' + lvl.level + '</b><em>' + lvl.xp + ' / ' + lvl.next + ' XP</em></div>' +
              '<div class="hm"><span>Время</span><b>' + U.minutesToHm(snap.minDone) + '</b><em>из ' + U.minutesToHm(snap.minPlanned) + '</em></div>' +
            '</div>' +
            '<div class="bar bar--thin mt-2"><div class="bar-fill" style="width:' + lvl.pct + '%"></div></div>' +
          '</div>' +
          '<div class="hero-r">' + C.ring(snap.pct, 116, 8) + '</div>' +
        '</div>';

      /* --- ПРИОРИТЕТЫ --- */
      var pr = St.topGoals();
      var prBody = pr.length
        ? '<ol class="prio">' + pr.map(function (p, i) {
            return '<li>' +
              '<span class="prio-n">' + (i + 1) + '</span>' +
              '<div class="grow">' +
                '<div class="prio-t">' + U.esc(p.goal.title) + '</div>' +
                C.progress(p.progress.pct, '', true) +
                '<div class="prio-x text-xs">' + U.esc(p.progress.label || p.progress.pct + '%') +
                  (p.goal.deadline ? ' · до ' + U.fmtDate(p.goal.deadline) : '') + '</div>' +
              '</div>' +
              '<button class="icon-btn" data-act="prio-open" data-id="' + p.goal.id + '" aria-label="Открыть цель">' + I.icon('chevR', 15) + '</button>' +
            '</li>';
          }).join('') + '</ol>'
        : C.empty('target', 'Приоритеты помогают не распыляться. Выбери до трёх целей.',
            '<button class="btn btn--sm" data-act="prio-edit">Выбрать цели</button>');

      var priorities = C.card({ title: 'Мои приоритеты', icon: 'flag', note: 'не больше 3',
        actions: pr.length ? '<button class="btn btn--sm btn--quiet" data-act="prio-edit">Изменить</button>' : '' }, prBody);

      /* --- ЗАДАЧИ --- */
      var tasksBody =
        '<div class="list">' +
          (undone.length ? undone.map(taskRow).join('') : '') +
          (done.length
            ? '<div class="list-divider"></div><div class="text-xs text-3 mb-2" style="padding-left:12px">Выполнено (' + done.length + ')</div>' + done.map(taskRow).join('')
            : '') +
          (!snap.tasks.length ? C.empty('cal', 'На этот день задач нет') : '') +
        '</div>' +
        '<div class="quick-input mt-2">' +
          '<span class="text-3">' + I.icon('plus', 16) + '</span>' +
          '<input id="qt" placeholder="Быстро добавить задачу и нажать Enter…" aria-label="Быстрая задача">' +
        '</div>';

      var tasks = C.card({
        title: 'Мои задачи на сегодня', icon: 'check',
        note: snap.tasksDone + ' / ' + snap.tasksTotal,
        actions: '<button class="btn btn--sm btn--quiet" data-act="task-add">' + I.icon('plus', 14) + ' Задача</button>'
      }, tasksBody);

      /* --- ПРИВЫЧКИ --- */
      var habitsBody =
        (snap.habits.length ? '<div class="list">' + snap.habits.map(function (h) { return habitRow(h, date); }).join('') + '</div>'
          : C.empty('target', 'Привычек на этот день нет', '<button class="btn btn--sm" data-act="hab-add">Создать привычку</button>')) +
        '<div class="row mt-2">' +
          '<button class="btn btn--sm btn--quiet" data-act="hab-add">' + I.icon('plus', 14) + ' Привычка</button>' +
          '<button class="btn btn--sm btn--ghost" data-act="go-habits">Календарь привычек ' + I.icon('chevR', 13) + '</button>' +
        '</div>';

      var habits = C.card({
        title: 'Привычки дня', icon: 'flame',
        note: snap.habitsDone + ' / ' + snap.habitsTotal
      }, habitsBody);

      /* --- МЫСЛЬ ДНЯ --- */
      var thought = C.card({ title: 'Мысль дня', icon: 'book', note: isToday ? 'сохраняется автоматически' : U.fmtDate(date) },
        '<textarea class="textarea" id="th" rows="3" placeholder="Одна мысль, которую стоит запомнить…">' + U.esc(snap.thought) + '</textarea>' +
        '<div class="row mt-2"><button class="btn btn--sm btn--ghost" data-act="go-diary">История мыслей ' + I.icon('chevR', 13) + '</button></div>');

      /* --- РЕТРОСПЕКТИВА / ЗАКРЫТИЕ ДНЯ --- */
      var retro = S.state.retros['day:' + date];
      var closeCard = snap.closed
        ? C.card({ title: 'День закрыт', icon: 'check' },
            (retro ? '<div class="retro-mini">' +
              [['Получилось', retro.answers.good], ['Не получилось', retro.answers.bad], ['Понял', retro.answers.lesson], ['Завтра иначе', retro.answers.tomorrow]]
                .filter(function (r) { return r[1]; })
                .map(function (r) { return '<div><span>' + r[0] + '</span><p>' + U.esc(r[1]) + '</p></div>'; }).join('') +
              '</div>' : '<p class="text-sm text-2">Ретроспектива не заполнена.</p>') +
            '<button class="btn btn--sm btn--quiet mt-2" data-act="day-retro">' + I.icon('edit', 14) + ' Дополнить ретроспективу</button>')
        : C.card({ title: 'Вечерний ритуал', icon: 'zap' },
            '<p class="text-sm text-2 mb-3">Приложение посчитает итоги и предложит четыре коротких вопроса. Это 60 секунд, но именно здесь появляется понимание, куда ты двигаешься.</p>' +
            '<button class="btn btn--primary btn--block" data-act="day-close">' + I.icon('flame', 15) + ' Закрыть день</button>');

      /* --- ЯДРО --- */
      host.innerHTML =
        '<div class="view-inner stack">' +
          hero +
          '<div class="split">' +
            '<div class="col">' + tasks + habits + '</div>' +
            '<div class="col">' + priorities + thought + closeCard + '</div>' +
          '</div>' +
        '</div>';

      /* ================= СОБЫТИЯ ================= */
      var go = function (d) { App.router.go('today', d === U.todayKey() ? null : { date: d }); };
      U.$('[data-act="day-prev"]', host).addEventListener('click', function () { go(U.addDays(date, -1)); });
      var nx = U.$('[data-act="day-next"]', host);
      if (nx) nx.addEventListener('click', function () { go(U.addDays(date, 1)); });
      var td = U.$('[data-act="day-today"]', host);
      if (td) td.addEventListener('click', function () { go(U.todayKey()); });

      U.delegate(host, 'click', '[data-act="task-toggle"]', function () {
        var id = this.closest('.task').getAttribute('data-id');
        S.toggleTask(id);
        var newAch = St.checkAchievements();
        newAch.forEach(function (a) { C.toast(a.icon + '  ' + a.name, 'ok', 4000); });
        App.router.render();
      });

      U.delegate(host, 'click', '[data-act="task-edit"]', function () {
        var id = this.closest('.task').getAttribute('data-id');
        var t = S.state.tasks.find(function (x) { return x.id === id; });
        if (t) editTask(t);
      });

      U.delegate(host, 'click', '[data-act="task-del"]', function () {
        var id = this.closest('.task').getAttribute('data-id');
        C.confirm('Удалить задачу?', 'Действие необратимо.', function () {
          S.removeTask(id); App.router.render();
        }, 'Удалить');
      });

      U.delegate(host, 'click', '[data-act="hab-toggle"]', function () {
        S.toggleHabit(this.closest('.task').getAttribute('data-id'), date);
        var newAch = St.checkAchievements();
        newAch.forEach(function (a) { C.toast(a.icon + '  ' + a.name, 'ok', 4000); });
        App.router.render();
      });

      U.delegate(host, 'click', '[data-act="hab-edit"]', function () {
        var id = this.closest('.task').getAttribute('data-id');
        var h = S.state.habits.find(function (x) { return x.id === id; });
        if (h) App.habits.edit(h.id);
      });

      U.delegate(host, 'click', '[data-act="task-add"]', function () { App.quickadd.openTask(date); });
      U.delegate(host, 'click', '[data-act="hab-add"]', function () { App.quickadd.openHabit(); });
      U.delegate(host, 'click', '[data-act="go-habits"]', function () { App.router.go('habits'); });
      U.delegate(host, 'click', '[data-act="go-diary"]', function () { App.router.go('diary'); });
      U.delegate(host, 'click', '[data-act="prio-edit"]', function () { App.goals.pickPriorities(); });
      U.delegate(host, 'click', '[data-act="prio-open"]', function () {
        App.router.go('goals', { focus: this.getAttribute('data-id') });
      });
      U.delegate(host, 'click', '[data-act="day-close"]', function () { closeDayFlow(date); });
      U.delegate(host, 'click', '[data-act="day-retro"]', function () { closeDayFlow(date); });

      /* Быстрая задача по Enter */
      var qt = U.$('#qt', host);
      if (qt) qt.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && this.value.trim()) {
          S.addTask({ title: this.value.trim(), date: date, minutes: 30, priority: 'mid', category: CATS[0] });
          App.router.render();
          setTimeout(function () { var q = U.$('#qt'); if (q) q.focus(); }, 30);
        }
      });

      /* Автосохранение мысли дня */
      var th = U.$('#th', host);
      if (th) {
        var save = U.debounce(function () {
          S.setThought(date, th.value);
          C.toast('Мысль сохранена', 'ok', 1400);
        }, 700);
        th.addEventListener('input', save);
        th.addEventListener('blur', save);
      }
    }
  });

  App.today = { closeDayFlow: closeDayFlow, editTask: editTask };
})(window.App = window.App || {});

</script>
<script>
/* ==== js/views/habits.js ==== */
/* ============================================================
   ВЕКТОР · Экран «ПРИВЫЧКИ» — сетка + heatmap
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui, St = App.stats;

  var CATS = ['Навыки','Бизнес','Здоровье','Развитие','Быт','Финансы','Отдых','Общее'];

  function editHabit(id) {
    var h = S.state.habits.find(function (x) { return x.id === id; });
    if (!h) return;
    C.formModal([
      { name: 'name', label: 'Название', value: h.name, required: true, span: 2 },
      { name: 'category', label: 'Категория', type: 'select', value: h.category,
        options: CATS.map(function (c) { return { value: c, label: c }; }) },
      { name: 'minutes', label: 'Минут в день', type: 'number', value: h.minutes, min: 0, step: 5 },
      { name: 'days', label: 'Дни недели', type: 'days', value: h.days, span: 2 }
    ], function (v) {
      S.updateHabit(h.id, { name: v.name.trim(), category: v.category, minutes: Number(v.minutes) || 0, days: v.days.split(',').map(Number) });
      C.toast('Привычка обновлена', 'ok');
      App.router.render();
    }, 'Сохранить', { title: 'Привычка', subtitle: h.name });
  }

  function habitDetail(id) {
    var h = S.state.habits.find(function (x) { return x.id === id; });
    if (!h) return;
    var from = U.addDays(U.todayKey(), -364);
    var st = St.habitStats(h, from, U.todayKey());
    var cells = U.rangeKeys(from, U.todayKey()).map(function (k) {
      return { key: k, on: !!(h.log && h.log[k]), active: (h.days || []).indexOf(U.dow(k)) !== -1 };
    });
    var heatHtml = cells.map(function (c) {
      var style = c.on ? 'background:var(--accent)' : !c.active ? 'background:transparent;border:1px dashed var(--line)' : 'background:var(--surface-3)';
      return '<span class="hcell" style="' + style + '" title="' + c.key + (c.on ? ' ✓' : '') + '"></span>';
    }).join('');

    C.modal({
      title: h.name, subtitle: h.category + ' · ' + U.minutesToHm(h.minutes),
      wide: true,
      body: '<div class="grid grid-3 mb-3">' +
        C.statTile('Выполнено', st.done + ' / ' + st.planned) +
        C.statTile('Процент', st.pct + '%') +
        C.statTile('Серия', st.currentStreak + ' дн') +
        C.statTile('Рекорд', st.bestStreak + ' дн') +
        C.statTile('Создана', h.createdAt) +
        C.statTile('Дней в неделю', (h.days || []).length) +
      '</div>' +
      '<div class="modal-sec">Активность за 365 дней</div>' +
      '<div class="hgrid">' + heatHtml + '</div>' +
      '<div class="row mt-3">' +
        '<button class="btn btn--sm" data-edit>' + I.icon('edit', 14) + ' Изменить</button>' +
        '<button class="btn btn--sm btn--danger" data-del>' + I.icon('trash', 14) + ' Удалить</button>' +
      '</div>',
      onMount: function (el, api) {
        el.querySelector('[data-edit]').addEventListener('click', function () { api.close(); editHabit(id); });
        el.querySelector('[data-del]').addEventListener('click', function () {
          api.close();
          C.confirm('Удалить привычку «' + h.name + '»?', 'Вся история отметок будет потеряна.', function () {
            S.removeHabit(id); App.router.render();
          }, 'Удалить');
        });
      }
    });
  }

  /* ======================= ЭКРАН ======================= */
  App.router.register({
    id: 'habits', title: 'Привычки', icon: 'target', group: 'Планирование', mobile: true,

    render: function (host, params) {
      var mode = params.view || 'week';
      var anchor = params.date || U.todayKey();
      var habits = S.state.habits;

      /* --- Даты периода --- */
      var days, periodLabel;
      if (mode === 'week') {
        var mon = U.mondayOf(anchor);
        days = U.weekKeys(mon);
        periodLabel = U.fmtDate(mon) + ' — ' + U.fmtDate(U.addDays(mon, 6));
      } else if (mode === 'month') {
        var mk = U.monthKey(anchor);
        days = U.monthKeysList(mk);
        periodLabel = U.fmtMonth(mk);
      } else {
        var y = String(anchor).slice(0, 4);
        days = U.rangeKeys(y + '-01-01', y + '-12-31');
        periodLabel = 'Год ' + y;
      }

      var from = days[0], to = days[days.length - 1];
      var today = U.todayKey();

      /* --- Сетка: строка привычки --- */
      function habitGridRow(h) {
        var st = St.habitStats(h, from, to);
        var cells = days.map(function (k) {
          var active = !h.createdAt || k >= h.createdAt;
          var isScheduled = (h.days || [0,1,2,3,4,5,6]).indexOf(U.dow(k)) !== -1;
          var done = !!(h.log && h.log[k]);
          var cls = !active ? 'cell--off' : !isScheduled ? 'cell--off' : done ? '' : '';
          var future = k > today ? ' cell--future' : '';
          var todayCls = k === today ? ' cell--today' : '';
          return '<button class="cell' + cls + future + todayCls + '" data-on="' + (done ? 1 : 0) + '"' +
            ' data-hid="' + h.id + '" data-date="' + k + '"' +
            (k > today ? ' disabled' : '') +
            ' aria-label="' + h.name + ' ' + k + '">' +
            (mode === 'week' ? (done ? '✓' : '○') : '') +
            (mode === 'month' ? parseInt(k.slice(8), 10) : '') +
          '</button>';
        }).join('');
        var head = mode === 'week'
          ? U.DOW_LABEL.map(function (d) { return '<span class="hlabel">' + d + '</span>'; }).join('')
          : '';
        return '<div class="hrow">' +
          '<div class="hname" data-hid="' + h.id + '" title="Подробнее">' +
            '<span class="dot" style="background:' + C.catColor(h.category) + '"></span>' +
            '<span class="t">' + U.esc(h.name) + '</span>' +
          '</div>' +
          '<div class="hcells" data-mode="' + mode + '">' + cells + '</div>' +
          '<div class="hright">' +
            '<span class="chip chip--accent">' + st.pct + '%</span>' +
            (st.currentStreak > 1 ? '<span class="chip chip--ok">' + I.icon('flame', 11) + st.currentStreak + '</span>' : '') +
          '</div>' +
        '</div>';
      }

      /* --- Heatmap за год --- */
      function yearHeatmap() {
        var year = String(anchor).slice(0, 4);
        var yFrom = year + '-01-01';
        var yTo = year + '-12-31';
        var allKeys = U.rangeKeys(yFrom, yTo);
        var cells = allKeys.map(function (k) {
          var total = 0, done = 0;
          habits.forEach(function (h) {
            if (h.createdAt && k < h.createdAt) return;
            if ((h.days || []).indexOf(U.dow(k)) === -1) return;
            total++;
            if (h.log && h.log[k]) done++;
          });
          var pct = total ? Math.round(done / total * 100) : 0;
          var lvl = pct === 0 ? 0 : pct < 40 ? 1 : pct < 70 ? 2 : pct < 100 ? 3 : 4;
          return { key: k, lvl: lvl, pct: pct, done: done, total: total, future: k > today };
        });
        var html = '<div class="heat">';
        var col = 0;
        cells.forEach(function (c) {
          if (col % 7 === 0) { if (col > 0) html += '</div>'; html += '<div class="heat-col">'; col++; }
          html += '<span class="heat-cell" data-l="' + c.lvl + '"' + (c.future ? ' data-future="1"' : '') +
            ' title="' + c.key + ': ' + c.done + '/' + c.total + '"></span>';
          col++;
        });
        html += '</div></div>';
        return html;
      }

      /* --- Статистика --- */
      var statsHtml = '<div class="grid grid-4 mb-4">';
      habits.forEach(function (h) {
        var st = St.habitStats(h, from, to);
        statsHtml += C.statTile(h.name, st.pct + '%', st.done + ' / ' + st.planned + ' дн', st.pct >= 80);
      });
      statsHtml += '</div>';

      /* --- Сборка --- */
      var nav =
        '<div class="row items-center justify-between mb-4">' +
          '<div class="row row-tight">' +
            '<button class="icon-btn icon-btn--line" data-act="prev">' + I.icon('chevL', 16) + '</button>' +
            '<b>' + U.esc(periodLabel) + '</b>' +
            '<button class="icon-btn icon-btn--line" data-act="next">' + I.icon('chevR', 16) + '</button>' +
          '</div>' +
          C.segmented([{ value: 'week', label: 'Неделя' }, { value: 'month', label: 'Месяц' }, { value: 'year', label: 'Год' }], mode) +
          '<button class="btn btn--sm btn--primary" data-act="hab-add">' + I.icon('plus', 14) + ' Привычка</button>' +
        '</div>';

      var gridHtml = habits.length
        ? '<div class="hgrid-wrap">' +
            (mode === 'week' ? '<div class="hrow hrow--head"><span></span><div class="hcells hcells--week">' +
              U.DOW_LABEL.map(function (d) { return '<span class="hlabel">' + d + '</span>'; }).join('') +
              '</div><span></span></div>' : '') +
            habits.map(habitGridRow).join('') +
          '</div>'
        : C.empty('target', 'Пока нет ни одной привычки', '<button class="btn btn--sm btn--primary" data-act="hab-add">Создать первую</button>');

      var heatHtml = habits.length ? '<div class="card mt-4"><div class="card-head"><span class="card-title">' + I.icon('cal', 15) + ' Heatmap за год</span></div>' + yearHeatmap() + '</div>' : '';

      host.innerHTML = '<div class="view-inner">' + nav + gridHtml + statsHtml + heatHtml + '</div>';

      /* ================= СОБЫТИЯ ================= */
      U.delegate(host, 'click', '.cell', function () {
        var hid = this.getAttribute('data-hid');
        var d = this.getAttribute('data-date');
        if (d > U.todayKey()) return;
        S.toggleHabit(hid, d);
        App.router.render();
      });
      U.delegate(host, 'click', '.hname', function () {
        habitDetail(this.getAttribute('data-hid'));
      });
      U.delegate(host, 'click', '[data-act="hab-add"]', function () { App.quickadd.openHabit(); });
      U.delegate(host, 'click', '[data-seg]', function () {
        var v = this.getAttribute('data-seg');
        App.router.go('habits', { view: v, date: anchor });
      });
      U.delegate(host, 'click', '[data-act="prev"]', function () {
        var newAnchor = mode === 'week' ? U.addDays(anchor, -7) : mode === 'month' ? U.addMonths(U.monthKey(anchor), -1) + '-01' : String(Number(String(anchor).slice(0,4)) - 1) + '-01-01';
        App.router.go('habits', { view: mode, date: newAnchor });
      });
      U.delegate(host, 'click', '[data-act="next"]', function () {
        var newAnchor = mode === 'week' ? U.addDays(anchor, 7) : mode === 'month' ? U.addMonths(U.monthKey(anchor), 1) + '-01' : String(Number(String(anchor).slice(0,4)) + 1) + '-01-01';
        App.router.go('habits', { view: mode, date: newAnchor });
      });
    }
  });

  App.habits = { edit: editHabit, detail: habitDetail };
})(window.App = window.App || {});

</script>
<script>
/* ==== js/views/goals.js ==== */
/* ============================================================
   ВЕКТОР · Экран «ЦЕЛИ» — дерево год → месяц → неделя → сегодня
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui, St = App.stats;

  var HORIZONS = [
    { value: 'year', label: 'Год' },
    { value: 'month', label: 'Месяц' },
    { value: 'week', label: 'Неделя' },
    { value: 'day', label: 'Сегодня' }
  ];
  var STATUS_LABEL = { active: 'В работе', done: 'Достигнута', paused: 'Пауза', archived: 'Архив' };

  function parentOptions(excludeId) {
    return [{ value: '', label: '— без родителя (верхний уровень)' }].concat(
      S.state.goals.filter(function (g) {
        return g.id !== excludeId && g.status !== 'archived';
      }).map(function (g) {
        return { value: g.id, label: '[' + horizonLabel(g.horizon) + '] ' + g.title };
      })
    );
  }

  function horizonLabel(h) {
    var f = HORIZONS.find(function (x) { return x.value === h; });
    return f ? f.label : h;
  }

  /* ---------- Форма цели ---------- */
  function editGoal(id) {
    var g = S.state.goals.find(function (x) { return x.id === id; });
    if (!g) return;
    C.formModal([
      { name: 'title', label: 'Название', value: g.title, required: true, span: 2 },
      { name: 'desc', label: 'Описание / зачем это мне', type: 'textarea', value: g.desc || '', rows: 2 },
      { name: 'horizon', label: 'Горизонт', type: 'select', value: g.horizon, options: HORIZONS },
      { name: 'deadline', label: 'Дедлайн', type: 'date', value: g.deadline || '' },
      { name: 'priority', label: 'Приоритет', type: 'select', value: g.priority,
        options: [{ value: 'high', label: 'Высокий' }, { value: 'mid', label: 'Средний' }, { value: 'low', label: 'Низкий' }] },
      { name: 'status', label: 'Статус', type: 'select', value: g.status,
        options: Object.keys(STATUS_LABEL).map(function (k) { return { value: k, label: STATUS_LABEL[k] }; }) },
      { name: 'parentId', label: 'Родительская цель', type: 'select', value: g.parentId || '', options: parentOptions(id), span: 2 },
      { name: 'mTarget', label: 'Измерение: цель', type: 'number', value: g.metric ? g.metric.target : '', min: 0, hint: 'Напр. 150000 (₽) или 300 (часов)' },
      { name: 'mUnit', label: 'Единица', value: g.metric ? g.metric.unit : '', placeholder: '₽ / часов / шт' },
      { name: 'mCurrent', label: 'Текущее значение', type: 'number', value: g.metric ? g.metric.current : 0, min: 0 },
      { name: 'manual', label: 'Или прогресс вручную, %', type: 'number', value: g.manual || 0, min: 0, max: 100 }
    ], function (v) {
      var metric = (v.mTarget && Number(v.mTarget) > 0)
        ? { target: Number(v.mTarget), unit: v.mUnit || '', current: Number(v.mCurrent) || 0 }
        : null;
      S.updateGoal(g.id, {
        title: v.title.trim(), desc: v.desc || '', horizon: v.horizon,
        deadline: v.deadline || null, priority: v.priority, status: v.status,
        parentId: v.parentId || null, metric: metric, manual: Number(v.manual) || 0
      });
      C.toast('Цель обновлена', 'ok');
      App.router.render();
    }, 'Сохранить', { title: 'Цель', subtitle: g.title, wide: true });
  }

  function newGoal(parentId, horizon) {
    C.formModal([
      { name: 'title', label: 'Название', required: true, span: 2, placeholder: 'Например: создать свой AI-продукт' },
      { name: 'desc', label: 'Описание', type: 'textarea', rows: 2, placeholder: 'Зачем это нужно и как понять, что готово' },
      { name: 'horizon', label: 'Горизонт', type: 'select', value: horizon || 'month', options: HORIZONS },
      { name: 'deadline', label: 'Дедлайн', type: 'date', value: '' },
      { name: 'priority', label: 'Приоритет', type: 'select', value: 'mid',
        options: [{ value: 'high', label: 'Высокий' }, { value: 'mid', label: 'Средний' }, { value: 'low', label: 'Низкий' }] },
      { name: 'parentId', label: 'Родительская цель', type: 'select', value: parentId || '', options: parentOptions(null), span: 2 },
      { name: 'mTarget', label: 'Измерение: цель', type: 'number', min: 0, placeholder: 'напр. 150000' },
      { name: 'mUnit', label: 'Единица', placeholder: '₽ / часов / шт' }
    ], function (v) {
      S.addGoal({
        title: v.title.trim(), desc: v.desc || '', horizon: v.horizon,
        deadline: v.deadline || null, priority: v.priority, parentId: v.parentId || null,
        metric: v.mTarget && Number(v.mTarget) > 0 ? { target: Number(v.mTarget), unit: v.mUnit || '', current: 0 } : null
      });
      C.toast('Цель создана', 'ok');
      App.router.render();
    }, 'Создать', { title: 'Новая цель', wide: true });
  }

  /* ---------- Разбить на шаги ---------- */
  function splitGoal(id) {
    var g = S.state.goals.find(function (x) { return x.id === id; });
    if (!g) return;
    var nextH = { year: 'month', month: 'week', week: 'day', day: 'day' };
    C.formModal([
      { name: 'title', label: 'Шаг', required: true, span: 2, placeholder: 'Что конкретно сделать?' },
      { name: 'count', label: 'Сколько шагов добавить', type: 'number', value: 1, min: 1, max: 5 },
      { name: 'horizon', label: 'Горизонт шага', type: 'select', value: nextH[g.horizon], options: HORIZONS },
      { name: 'deadline', label: 'Дедлайн', type: 'date', value: g.deadline || '' }
    ], function (v) {
      var n = U.clamp(Number(v.count) || 1, 1, 5);
      for (var i = 0; i < n; i++) {
        S.addGoal({ title: n > 1 ? v.title.trim() + ' #' + (i + 1) : v.title.trim(), horizon: v.horizon, parentId: id, deadline: v.deadline || null, priority: 'mid' });
      }
      C.toast('Добавлено ' + n + ' ' + U.plural(n, ['шаг','шага','шагов']), 'ok');
      App.router.render();
    }, 'Добавить шаги', { title: 'Разбить цель: ' + g.title, subtitle: 'Большая цель → маленькие действия' });
  }

  /* ---------- Приоритеты ---------- */
  function pickPriorities() {
    var active = S.state.goals.filter(function (g) { return g.status === 'active' || g.status === 'paused'; });
    if (!active.length) { C.toast('Сначала создай хотя бы одну цель', 'bad'); return; }
    var cur = S.state.priorities.slice();
    var body = '<p class="text-sm text-2 mb-3">Выбери не больше трёх. Порядок = порядок важности.</p>' +
      '<div class="prio-pick">' + active.map(function (g) {
        var on = cur.indexOf(g.id) !== -1;
        return '<label class="prio-opt' + (on ? ' on' : '') + '">' +
          '<input type="checkbox" value="' + g.id + '"' + (on ? ' checked' : '') + '>' +
          '<span>' + U.esc(g.title) + ' <em>' + horizonLabel(g.horizon) + '</em></span></label>';
      }).join('') + '</div>';
    C.modal({
      title: 'Мои приоритеты', subtitle: 'Главное направление — первое',
      body: body,
      actions: '<button class="btn btn--ghost" data-close>Отмена</button><button class="btn btn--primary" data-save>Сохранить</button>',
      onMount: function (el, api) {
        var boxes = U.$$('[type=checkbox]', el);
        boxes.forEach(function (b) {
          b.addEventListener('change', function () {
            var n = boxes.filter(function (x) { return x.checked; }).length;
            if (n > 3) { b.checked = false; C.toast('Максимум 3 приоритета', 'bad'); }
            else b.closest('.prio-opt').classList.toggle('on', b.checked);
          });
        });
        el.querySelector('[data-save]').addEventListener('click', function () {
          var ids = boxes.filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
          S.setPriorities(ids);
          api.close();
          C.toast('Приоритеты обновлены', 'ok');
          App.router.render();
        });
      }
    });
  }

  /* ---------- Карточка цели ---------- */
  function goalCard(g, depth) {
    var p = St.goalProgress(g.id);
    var kids = S.state.goals.filter(function (x) { return x.parentId === g.id && x.status !== 'archived'; });
    var tasks = S.state.tasks.filter(function (t) { return t.goalId === g.id; });
    var cls = g.status === 'done' ? ' ok' : g.status === 'archived' ? ' arch' : '';
    var overdue = g.deadline && g.status === 'active' && g.deadline < U.todayKey();

    return '<div class="gcard' + cls + '" data-id="' + g.id + '" style="margin-left:' + Math.min(depth, 3) * 16 + 'px">' +
      '<div class="gcard-top">' +
        '<span class="chip chip--' + (g.priority === 'high' ? 'hi' : g.priority === 'low' ? 'low' : 'mid') + '">' + horizonLabel(g.horizon) + '</span>' +
        '<span class="grow"></span>' +
        (g.status !== 'active' ? '<span class="chip chip--' + (g.status === 'done' ? 'ok' : 'low') + '">' + STATUS_LABEL[g.status] + '</span>' : '') +
        '<button class="icon-btn" data-act="g-menu" aria-label="Ещё">' + I.icon('more', 16) + '</button>' +
      '</div>' +
      '<div class="gcard-title" data-act="g-open">' + U.esc(g.title) + '</div>' +
      (g.desc ? '<p class="gcard-desc">' + U.esc(g.desc) + '</p>' : '') +
      '<div class="gcard-bar">' + C.progress(p.pct, p.pct >= 80 ? 'ok' : '') +
        '<span class="gcard-pct mono">' + p.pct + '%</span></div>' +
      '<div class="gcard-meta text-xs">' +
        (p.label ? '<span class="chip">' + U.esc(p.label) + '</span>' : '') +
        (g.deadline ? '<span class="chip' + (overdue ? ' chip--hi' : '') + '">' + I.icon('cal', 11) + U.fmtDate(g.deadline) + (overdue ? ' · просрочено' : ' · ' + U.relative(g.deadline)) + '</span>' : '') +
        (tasks.length ? '<span class="chip">' + tasks.filter(function (t) { return t.done; }).length + '/' + tasks.length + ' задач</span>' : '') +
      '</div>' +
      (kids.length ? '<div class="gcard-kids">' + kids.map(function (k) { return goalCard(k, 0); }).join('') + '</div>' : '') +
    '</div>';
  }

  function goalMenu(id) {
    var g = S.state.goals.find(function (x) { return x.id === id; });
    if (!g) return;
    C.modal({
      title: g.title, subtitle: horizonLabel(g.horizon) + ' · ' + STATUS_LABEL[g.status],
      body: '<div class="stack">' +
        '<button class="qm-item" data-a="edit">' + I.icon('edit', 18) + '<span>Изменить цель</span></button>' +
        '<button class="qm-item" data-a="split">' + I.icon('layers', 18) + '<span>Разбить на шаги</span></button>' +
        '<button class="qm-item" data-a="task">' + I.icon('check', 18) + '<span>Добавить задачу к цели</span></button>' +
        '<button class="qm-item" data-a="status">' + I.icon('zap', 18) + '<span>Статус: ' + STATUS_LABEL[g.status] + ' → сменить</span></button>' +
        '<button class="qm-item" data-a="metric">' + I.icon('chart', 18) + '<span>Обновить прогресс</span></button>' +
        '<button class="qm-item" data-a="del">' + I.icon('trash', 18) + '<span class="text-bad">Удалить</span></button>' +
      '</div>',
      onMount: function (el, api) {
        var act = function (a) {
          api.close();
          if (a === 'edit') editGoal(id);
          if (a === 'split') splitGoal(id);
          if (a === 'status') { S.cycleGoalStatus(id); St.checkAchievements(); App.router.render(); }
          if (a === 'del') C.confirm('Удалить цель?', 'Связанные задачи останутся, но потеряют привязку.', function () { S.removeGoal(id); App.router.render(); }, 'Удалить');
          if (a === 'task') App.quickadd.openTask(U.todayKey(), id);
          if (a === 'metric') metricModal(g);
        };
        U.$$('[data-a]', el).forEach(function (b) { b.addEventListener('click', function () { act(b.getAttribute('data-a')); }); });
      }
    });
  }

  function metricModal(g) {
    if (!g.metric) { editGoal(g.id); return; }
    C.formModal([
      { name: 'current', label: 'Текущее значение (' + (g.metric.unit || '') + ')', type: 'number', value: g.metric.current, min: 0, span: 2 },
      { name: 'target', label: 'Целевое значение', type: 'number', value: g.metric.target, min: 1 }
    ], function (v) {
      S.updateGoal(g.id, { metric: { target: Number(v.target), unit: g.metric.unit, current: Number(v.current) || 0 } });
      if (Number(v.current) >= Number(v.target) && g.status === 'active') S.cycleGoalStatus(g.id);
      else App.router.render();
      C.toast('Прогресс обновлён', 'ok');
    }, 'Сохранить', { title: g.title, subtitle: 'Прогресс по измерению' });
  }

  /* ======================= ЭКРАН ======================= */
  App.router.register({
    id: 'goals', title: 'Цели', icon: 'flag', group: 'Планирование', mobile: true,

    render: function (host, params) {
      var focus = params.focus;
      var roots = S.state.goals.filter(function (g) { return !g.parentId || !S.state.goals.find(function (x) { return x.id === g.parentId; }); })
        .filter(function (g) { return g.status !== 'archived'; });

      var stats = {
        year: St.goalsByHorizon('year').length,
        month: St.goalsByHorizon('month').length,
        week: St.goalsByHorizon('week').length,
        done: S.state.goals.filter(function (g) { return g.status === 'done'; }).length
      };

      var treeHtml = roots.length
        ? '<div class="gtree">' + roots.map(function (g) { return goalCard(g, 0); }).join('') + '</div>'
        : C.empty('flag', 'Целей пока нет. Начни с большой — годовой, а потом разбей её на шаги.',
            '<button class="btn btn--sm btn--primary" data-act="new">Создать цель</button>');

      var byHorizon = HORIZONS.map(function (h) {
        var list = St.goalsByHorizon(h.value);
        if (!list.length) return '';
        return C.section(h.label + ' — ' + list.length, '',
          '<div class="stack">' + list.filter(function (g) { return !g.parentId; }).map(function (g) { return goalCard(g, 0); }).join('') + '</div>');
      }).join('');

      host.innerHTML =
        '<div class="view-inner">' +
          '<div class="row items-center justify-between mb-4">' +
            '<div class="grid grid-4" style="width:100%">' +
              C.statTile('Годовые', stats.year) + C.statTile('Месячные', stats.month) +
              C.statTile('Недельные', stats.week) + C.statTile('Достигнуто', stats.done, '', true) +
            '</div>' +
          '</div>' +
          '<div class="row mb-4">' +
            '<button class="btn btn--primary btn--sm" data-act="new">' + I.icon('plus', 14) + ' Новая цель</button>' +
            '<button class="btn btn--sm" data-act="prio">' + I.icon('star', 14) + ' Приоритеты</button>' +
            '<span class="grow"></span>' +
            '<span class="text-xs text-3">Большая цель → месяц → неделя → сегодня</span>' +
          '</div>' +
          treeHtml +
          '<div class="mt-5">' + byHorizon + '</div>' +
        '</div>';

      /* Подсветка сфокусированной цели */
      if (focus) {
        var el = host.querySelector('.gcard[data-id="' + focus + '"]');
        if (el) { el.classList.add('focus'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      }

      U.delegate(host, 'click', '[data-act="new"]', function () { newGoal(); });
      U.delegate(host, 'click', '[data-act="prio"]', function () { pickPriorities(); });
      U.delegate(host, 'click', '[data-act="g-menu"]', function (e) {
        e.stopPropagation();
        goalMenu(this.closest('.gcard').getAttribute('data-id'));
      });
      U.delegate(host, 'click', '[data-act="g-open"]', function () {
        goalMenu(this.closest('.gcard').getAttribute('data-id'));
      });
    }
  });

  App.goals = { edit: editGoal, newGoal: newGoal, split: splitGoal, pickPriorities: pickPriorities };
})(window.App = window.App || {});

</script>
<script>
/* ==== js/views/week.js ==== */
/* ============================================================
   ВЕКТОР · Экран «НЕДЕЛЯ»
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui, St = App.stats;

  App.router.register({
    id: 'week', title: 'Неделя', icon: 'cal', group: 'День', mobile: true,

    render: function (host, params) {
      var anchor = params.date || U.todayKey();
      var mon = U.mondayOf(anchor);
      var days = U.weekKeys(mon);
      var ws = St.weekSummary(mon);
      var today = U.todayKey();

      /* --- Колонка дня --- */
      function dayCol(k) {
        var snap = St.daySnapshot(k);
        var isToday = k === today;
        var events = S.state.goals.filter(function (g) {
          return g.deadline === k && g.status === 'active';
        });
        var items = snap.tasks.map(function (t) {
          return '<div class="wk-task' + (t.done ? ' done' : '') + '" data-id="' + t.id + '">' +
            '<button class="check" style="width:17px;height:17px" data-act="wk-toggle" aria-checked="' + !!t.done + '">' + I.icon('check', 11) + '</button>' +
            '<span>' + U.esc(t.title) + '</span></div>';
        }).join('');
        var hab = snap.habits.map(function (h) {
          var on = !!(h.log && h.log[k]);
          return '<button class="wk-hab' + (on ? ' on' : '') + '" data-hid="' + h.id + '" data-act="wk-hab" title="' + U.esc(h.name) + '">' +
            '<span class="dot"></span>' + U.esc(h.name) + '</button>';
        }).join('');

        return '<div class="wk-day' + (isToday ? ' today' : '') + (k > today ? ' future' : '') + '" data-date="' + k + '">' +
          '<button class="wk-head" data-act="wk-open">' +
            '<span class="wk-dow">' + U.DOW_LABEL[(U.dow(k) + 6) % 7] + '</span>' +
            '<span class="wk-num">' + parseInt(k.slice(8), 10) + '</span>' +
            '<span class="wk-pct mono">' + (snap.total ? snap.pct + '%' : '—') + '</span>' +
          '</button>' +
          C.progress(snap.pct, snap.pct >= (S.state.settings.dayTarget || 70) ? 'ok' : '', true) +
          '<div class="wk-body">' +
            (items || '') +
            (hab ? '<div class="wk-habs">' + hab + '</div>' : '') +
            (events.map(function (g) { return '<div class="wk-ev">' + I.icon('flag', 11) + U.esc(g.title) + '</div>'; }).join('')) +
            (!snap.total && !events.length ? '<div class="wk-none">—</div>' : '') +
          '</div>' +
        '</div>';
      }

      /* --- Итоги недели --- */
      var habitRows = S.state.habits.map(function (h) {
        var st = St.habitStats(h, mon, U.addDays(mon, 6));
        return { name: h.name, pct: st.pct, done: st.done, planned: st.planned };
      }).filter(function (r) { return r.planned > 0; }).sort(function (a, b) { return b.pct - a.pct; });

      var bestHab = habitRows[0], worstHab = habitRows[habitRows.length - 1];

      /* Главная победа — из ретроспективы, либо вычисляемая */
      var retro = S.state.retros['week:' + mon];
      var win = retro && retro.answers.win
        ? retro.answers.win
        : (ws.tasksDone ? 'Выполнено ' + ws.tasksDone + ' ' + U.plural(ws.tasksDone, ['задача','задачи','задач']) +
            (bestHab ? ' и лучшая привычка — ' + bestHab.name + ' (' + bestHab.pct + '%)' : '')
          : 'Пока нет выполненных задач — начни с одного шага');

      var summary =
        '<div class="card mt-5">' +
          '<div class="card-head">' +
            '<span class="card-title">' + I.icon('zap', 15) + ' Итоги недели</span>' +
            '<button class="btn btn--sm btn--quiet" data-act="week-retro">' + I.icon('edit', 13) + ' Ретроспектива недели</button>' +
          '</div>' +
          '<div class="grid grid-4 mb-4">' +
            C.statTile('Задач выполнено', ws.tasksDone + ' / ' + ws.tasksTotal) +
            C.statTile('Прогресс недели', ws.pct + '%', '', ws.pct >= 70) +
            C.statTile('Привычек', ws.habitsDone + ' / ' + ws.habitsTotal) +
            C.statTile('Часов потрачено', Math.round(ws.minDone / 60 * 10) / 10 + ' ч') +
          '</div>' +
          '<div class="grid grid-2">' +
            C.statTile('Лучшая привычка', bestHab ? bestHab.name : '—', bestHab ? bestHab.pct + '% за неделю' : 'нет данных', true) +
            C.statTile('Провальная привычка', worstHab ? worstHab.name : '—', worstHab ? worstHab.pct + '% за неделю' : 'нет данных') +
          '</div>' +
          '<div class="win-block mt-3">' +
            '<span class="stat-k">Главная победа недели</span>' +
            '<p>' + U.esc(win) + '</p>' +
          '</div>' +
          (retro ? '<div class="retro-mini mt-3">' +
            [['Ошибка', retro.answers.error], ['Время ушло на', retro.answers.time], ['Результат дал', retro.answers.result], ['Изменю', retro.answers.change]]
              .filter(function (r) { return r[1]; })
              .map(function (r) { return '<div><span>' + r[0] + '</span><p>' + U.esc(r[1]) + '</p></div>'; }).join('') +
            '</div>' : '') +
        '</div>';

      host.innerHTML =
        '<div class="view-inner">' +
          '<div class="row items-center justify-between mb-4">' +
            '<div class="row row-tight">' +
              '<button class="icon-btn icon-btn--line" data-act="prev">' + I.icon('chevL', 16) + '</button>' +
              '<b>' + U.fmtDate(mon) + ' — ' + U.fmtDate(U.addDays(mon, 6)) + '</b>' +
              '<button class="icon-btn icon-btn--line" data-act="next">' + I.icon('chevR', 16) + '</button>' +
              '<button class="btn btn--sm btn--ghost" data-act="now">Текущая</button>' +
            '</div>' +
            '<span class="chip chip--accent">' + ws.prodDays + ' ' + U.plural(ws.prodDays, ['продуктивный день','продуктивных дня','продуктивных дней']) + '</span>' +
          '</div>' +
          '<div class="wk-grid">' + days.map(dayCol).join('') + '</div>' +
          summary +
        '</div>';

      var goW = function (d) { App.router.go('week', { date: d }); };
      U.$('[data-act="prev"]', host).addEventListener('click', function () { goW(U.addDays(mon, -7)); });
      U.$('[data-act="next"]', host).addEventListener('click', function () { goW(U.addDays(mon, 7)); });
      U.$('[data-act="now"]', host).addEventListener('click', function () { App.router.go('week'); });

      U.delegate(host, 'click', '[data-act="wk-open"]', function () {
        App.router.go('today', { date: this.closest('.wk-day').getAttribute('data-date') });
      });
      U.delegate(host, 'click', '[data-act="wk-toggle"]', function (e) {
        e.stopPropagation();
        S.toggleTask(this.closest('.wk-task').getAttribute('data-id'));
        App.router.render();
      });
      U.delegate(host, 'click', '[data-act="wk-hab"]', function (e) {
        e.stopPropagation();
        S.toggleHabit(this.getAttribute('data-hid'), this.closest('.wk-day').getAttribute('data-date'));
        App.router.render();
      });
      U.delegate(host, 'click', '[data-act="week-retro"]', function () {
        App.retro.open('week', mon);
      });
    }
  });
})(window.App = window.App || {});

</script>
<script>
/* ==== js/views/month.js ==== */
/* ============================================================
   ВЕКТОР · Экран «МЕСЯЦ» — дашборд месяца
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui, St = App.stats, Ch = App.charts;

  App.router.register({
    id: 'month', title: 'Месяц', icon: 'chart', group: 'Анализ',

    render: function (host, params) {
      var mk = params.month || U.monthKey(U.todayKey());
      var ms = St.monthSummary(mk);
      var today = U.todayKey();
      var isNow = mk === U.monthKey(today);

      /* --- Цели месяца --- */
      var monthGoals = S.state.goals.filter(function (g) {
        return (g.horizon === 'month' || g.horizon === 'week') && g.status !== 'archived' &&
          (!g.deadline || g.deadline.slice(0, 7) === mk || g.deadline >= mk + '-01');
      });
      var goalsBody = monthGoals.length
        ? '<table class="tbl"><thead><tr><th>Цель</th><th>Дедлайн</th><th style="width:34%">Прогресс</th><th>Статус</th></tr></thead><tbody>' +
            monthGoals.map(function (g) {
              var p = St.goalProgress(g.id);
              return '<tr data-id="' + g.id + '">' +
                '<td><b>' + U.esc(g.title) + '</b><div class="text-xs text-3">' + U.esc(g.desc || '') + '</div></td>' +
                '<td class="mono">' + (g.deadline ? U.fmtDate(g.deadline) : '—') + '</td>' +
                '<td>' + C.progress(p.pct, p.pct >= 80 ? 'ok' : '') + '<div class="text-xs text-3 mt-1">' + p.pct + '% · ' + U.esc(p.label || '') + '</div></td>' +
                '<td><span class="chip chip--' + (g.status === 'done' ? 'ok' : 'low') + '">' + (g.status === 'done' ? 'Готово' : 'В работе') + '</span></td>' +
              '</tr>';
            }).join('') + '</tbody></table>'
        : C.empty('flag', 'На этот месяц целей нет');

      /* --- Привычки месяца --- */
      var from = mk + '-01';
      var to = mk + '-' + String(U.daysInMonth(mk)).padStart(2, '0');
      if (isNow) to = today;
      var hs = St.allHabitsStats(from, to).sort(function (a, b) { return b.pct - a.pct; });
      var habBody = hs.length
        ? '<div class="hbars">' + hs.map(function (h) {
            return '<div class="hbar">' +
              '<span class="hbar-n">' + U.esc(h.name) + '</span>' +
              '<div class="hbar-track">' + C.progress(h.pct, h.pct >= 80 ? 'ok' : h.pct < 40 ? 'warn' : '') + '</div>' +
              '<span class="hbar-v mono">' + h.done + '/' + h.planned + '</span>' +
              '<span class="hbar-p mono">' + h.pct + '%</span>' +
            '</div>';
          }).join('') + '</div>'
        : C.empty('target', 'Привычек за месяц нет');

      /* --- График по дням --- */
      var series = U.monthKeysList(mk).filter(function (k) { return k <= today; }).map(function (k) {
        var s = St.daySnapshot(k);
        return { label: String(parseInt(k.slice(8), 10)), pct: s.pct };
      });

      host.innerHTML =
        '<div class="view-inner">' +
          '<div class="row items-center justify-between mb-4">' +
            '<div class="row row-tight">' +
              '<button class="icon-btn icon-btn--line" data-act="prev">' + I.icon('chevL', 16) + '</button>' +
              '<b style="font-size:var(--fs-xl);letter-spacing:-.02em">' + U.fmtMonth(mk) + '</b>' +
              '<button class="icon-btn icon-btn--line" data-act="next">' + I.icon('chevR', 16) + '</button>' +
            '</div>' +
            '<div class="row row-tight">' +
              '<button class="btn btn--sm btn--ghost" data-act="now">Текущий</button>' +
              '<button class="btn btn--sm btn--quiet" data-act="month-retro">' + I.icon('edit', 13) + ' Ретроспектива месяца</button>' +
            '</div>' +
          '</div>' +

          '<div class="grid grid-4 mb-4">' +
            C.statTile('Задач выполнено', ms.tasksDone + ' / ' + ms.tasksTotal) +
            C.statTile('Средний % дня', ms.avgPct + '%', '', ms.avgPct >= 70) +
            C.statTile('Продуктивных дней', ms.prodDays + ' / ' + ms.days.length) +
            C.statTile('Часов работы', Math.round(ms.minDone / 60 * 10) / 10 + ' ч') +
          '</div>' +

          C.card({ title: 'Прогресс по дням', icon: 'chart', note: 'выполнение задач + привычек, %' },
            '<div id="mchart"></div>' +
            (series.length < 3 ? '<p class="text-xs text-3 mt-2">Нужно минимум 3 дня данных, чтобы график стал осмысленным.</p>' : '')) +

          '<div class="split mt-4">' +
            '<div class="col">' +
              C.card({ title: 'Цели месяца', icon: 'flag', note: monthGoals.length + ' шт',
                actions: '<button class="btn btn--sm btn--quiet" data-act="new-goal">' + I.icon('plus', 13) + '</button>' }, goalsBody) +
              C.card({ title: 'Привычки месяца', icon: 'target', note: 'выполнений / запланировано' }, habBody) +
            '</div>' +
            '<div class="col">' +
              C.card({ title: 'Самая стабильная', icon: 'star' },
                hs.length ? '<div style="font-size:var(--fs-lg);font-weight:700">' + U.esc(hs[0].name) + '</div><p class="text-2 text-sm">' + hs[0].pct + '% · серия ' + hs[0].currentStreak + ' дн · рекорд ' + hs[0].bestStreak + '</p>'
                  : '<p class="text-sm text-3">Нет данных</p>') +
              C.card({ title: 'Самая проблемная', icon: 'alert' },
                hs.length ? '<div style="font-size:var(--fs-lg);font-weight:700">' + U.esc(hs[hs.length - 1].name) + '</div><p class="text-2 text-sm">' + hs[hs.length - 1].pct + '% · пропущено ' + (hs[hs.length - 1].planned - hs[hs.length - 1].done) + ' дн</p>'
                  : '<p class="text-sm text-3">Нет данных</p>') +
              C.card({ title: 'Пропущено задач', icon: 'x' },
                '<div style="font-size:var(--fs-2xl);font-weight:750" class="mono">' + (ms.tasksTotal - ms.tasksDone) + '</div>' +
                '<p class="text-sm text-3">из ' + ms.tasksTotal + ' запланированных</p>') +
              C.card({ title: 'Мысли за месяц', icon: 'book' },
                '<div style="font-size:var(--fs-2xl);font-weight:750" class="mono">' +
                  Object.keys(S.state.thoughts).filter(function (k) { return k.slice(0, 7) === mk; }).length + '</div>' +
                '<button class="btn btn--sm btn--ghost mt-2" data-act="go-diary">Открыть дневник</button>') +
            '</div>' +
          '</div>' +
        '</div>';

      if (series.length >= 2) Ch.line(U.$('#mchart', host), series, { height: 200 });

      U.$('[data-act="prev"]', host).addEventListener('click', function () {
        App.router.go('month', { month: U.addMonths(mk, -1) }); });
      U.$('[data-act="next"]', host).addEventListener('click', function () {
        App.router.go('month', { month: U.addMonths(mk, 1) }); });
      U.$('[data-act="now"]', host).addEventListener('click', function () { App.router.go('month'); });
      U.delegate(host, 'click', '[data-act="new-goal"]', function () { App.goals.newGoal(null, 'month'); });
      U.delegate(host, 'click', '[data-act="month-retro"]', function () { App.retro.open('month', mk); });
      U.delegate(host, 'click', '[data-act="go-diary"]', function () { App.router.go('diary'); });
      U.delegate(host, 'click', '.tbl tbody tr', function () {
        App.goals.edit(this.getAttribute('data-id'));
      });
    }
  });
})(window.App = window.App || {});

</script>
<script>
/* ==== js/views/year.js ==== */
/* ============================================================
   ВЕКТОР · Экран «ГОД»
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils, I = App.icons, S = App.store, C = App.ui, St = App.stats, Ch = App.charts;

  App.router.register({
    id: 'year', title: 'Год', icon: 'layers', group: 'Анализ',

    render: function (host, params) {
      var year = params.year || String(new Date().getFullYear());
      var ys = St.yearSummary(Number(year));
      var today = U.todayKey();

      /* --- Главные годовые цели --- */
      var yg = S.state.goals.filter(function (g) {
        return (g.horizon === 'year' || !g.horizon) && g.status !== 'archived';
      });
      var goalsHtml = yg.length
        ? '<div class="stack">' + yg.map(function (g) {
            var p = St.goalProgress(g.id);
            var kids = S.state.goals.filter(function (x) { return x.parentId === g.id; });
            return '<div class="ygoal" data-id="' + g.id + '">' +
              '<div class="ygoal-l">' +
                '<div class="row row-tight">' +
                  '<span class="chip chip--' + (g.status === 'done' ? 'ok' : g.priority === 'high' ? 'hi' : 'mid') + '">' +
                    (g.status === 'done' ? 'Достигнута' : 'В работе') + '</span>' +
                  (g.deadline ? '<span class="chip">' + I.icon('cal', 11) + U.fmtDate(g.deadline) + '</span>' : '') +
                '</div>' +
                '<h3>' + U.esc(g.title) + '</h3>' +
                (g.desc ? '<p class="text-sm text-2">' + U.esc(g.desc) + '</p>' : '') +
                '<div class="mt-2">' + C.progress(p.pct, p.pct >= 80 ? 'ok' : '') + '</div>' +
                '<div class="text-xs text-3 mt-1">' + U.esc(p.label || (p.pct + '%')) +
                  (kids.length ? ' · ' + kids.length + ' ' + U.plural(kids.length, ['шаг','шага','шагов']) : '') + '</div>' +
              '</div>' +
              '<div class="ygoal-r">' + C.ring(p.pct, 68, 6) + '</div>' +
            '</div>';
          }).join('') + '</div>'
        : C.empty('flag', 'Годовых целей нет. Это самый важный уровень — от него зависят все месячные шаги.',
            '<button class="btn btn--sm btn--primary" data-act="new-year-goal">Поставить годовую цель</button>');

      /* --- Heatmap года --- */
      var yFrom = year + '-01-01', yTo = year + '-12-31';
      var keys = U.rangeKeys(yFrom, yTo);
      var cells = keys.map(function (k) {
        var s = St.daySnapshot(k);
        var lvl = s.total === 0 ? 0 : s.pct < 40 ? 1 : s.pct < 70 ? 2 : s.pct < 100 ? 3 : 4;
        return { key: k, lvl: lvl, done: s.done, total: s.total, future: k > today };
      });
      var heat = '<div class="heat">';
      for (var w = 0; w * 7 < cells.length; w++) {
        heat += '<div class="heat-col">';
        for (var d = 0; d < 7; d++) {
          var c = cells[w * 7 + d];
          if (!c) { heat += '<span class="heat-cell" style="visibility:hidden"></span>'; continue; }
          heat += '<span class="heat-cell" data-l="' + c.lvl + '"' + (c.future ? ' data-future="1"' : '') +
            ' title="' + c.key + ': ' + c.done + '/' + c.total + '"></span>';
        }
        heat += '</div>';
      }
      heat += '</div>';

      /* --- Месячная активность --- */
      var mseries = ys.months.map(function (m, i) {
        return { label: U.MONTH_SHORT[i], value: m.avgPct, pct: m.avgPct };
      });

      host.innerHTML =
        '<div class="view-inner">' +
          '<div class="row items-center justify-between mb-4">' +
            '<div class="row row-tight">' +
              '<button class="icon-btn icon-btn--line" data-act="prev">' + I.icon('chevL', 16) + '</button>' +
              '<b style="font-size:var(--fs-2xl);letter-spacing:-.03em">' + year + '</b>' +
              '<button class="icon-btn icon-btn--line" data-act="next">' + I.icon('chevR', 16) + '</button>' +
            '</div>' +
            '<span class="chip chip--accent">' + U.fmtDate(today) + ' · день ' + (U.diffDays(year + '-01-01', today) + 1) + ' года</span>' +
          '</div>' +

          '<div class="grid grid-4 mb-4">' +
            C.statTile('Выполнение года', ys.pct + '%', '', ys.pct >= 70) +
            C.statTile('Задач закрыто', ys.tasksDone + ' / ' + ys.tasksTotal) +
            C.statTile('Месячных целей', ys.goalsDone + ' достигнуто') +
            C.statTile('Продуктивных дней', ys.prodDays) +
          '</div>' +

          C.section('Главные цели года', 'то, что определяет год', goalsHtml) +

          C.card({ title: 'Активность по месяцам', icon: 'chart', note: 'средний % выполнения дня' },
            '<div id="ychart"></div>') +

          '<div class="card mt-4">' +
            '<div class="card-head">' +
              '<span class="card-title">' + I.icon('cal', 15) + ' Весь год одним взглядом</span>' +
              '<div class="heat-legend">меньше' +
                [0,1,2,3,4].map(function (l) { return '<span class="heat-cell" data-l="' + l + '"></span>'; }).join('') +
              'больше</div>' +
            '</div>' + heat +
            '<p class="text-xs text-3 mt-2">Каждая клетка — день. Пустые = не было плана. Чем темнее, тем выше выполнение.</p>' +
          '</div>' +

          C.section('История ретроспектив года', 'что я понял за этот год',
            (function () {
              var rs = Object.keys(S.state.retros).filter(function (k) {
                return k.indexOf('month:' + year) === 6 || k.indexOf('week:' + year) === 5;
              }).map(function (k) {
                return { key: k, r: S.state.retros[k] };
              }).sort(function (a, b) { return b.key < a.key ? -1 : 1; });
              if (!rs.length) return C.empty('book', 'Ретроспектив за год нет. Начни с вечерней — она занимает минуту.');
              return '<div class="stack">' + rs.slice(0, 12).map(function (x) {
                var parts = x.key.split(':');
                var isM = parts[0] === 'month';
                var label = isM ? U.fmtMonth(parts[1]) : 'неделя с ' + U.fmtDate(parts[1]);
                var win = x.r.answers.win || x.r.answers.good || '';
                return '<div class="retro-card">' +
                  '<div class="retro-card-h">' + (isM ? '📆' : '🗓') + ' ' + label +
                    '<span class="text-3 text-xs">' + new Date(x.r.updatedAt).toLocaleDateString('ru') + '</span></div>' +
                  (win ? '<p class="text-sm"><b>Победа:</b> ' + U.esc(win) + '</p>' : '') +
                  '<div class="retro-grid">' + Object.keys(x.r.answers).filter(function (a) { return x.r.answers[a] && a !== 'win' && a !== 'good'; }).slice(0, 3).map(function (a) {
                    return '<div><span class="text-xs text-3">' + App.retro.LABELS[a] + '</span><p class="text-sm">' + U.esc(x.r.answers[a]) + '</p></div>';
                  }).join('') + '</div>' +
                '</div>';
              }).join('') + '</div>';
            })()) +
        '</div>';

      Ch.bars(U.$('#ychart', host), mseries, { height: 190, maxV: 100 });

      U.$('[data-act="prev"]', host).addEventListener('click', function () {
        App.router.go('year', { year: String(Number(year) - 1) }); });
      U.$('[data-act="next"]', host).addEventListener('click', function () {
        App.router.go('year', { year: String(Number(year) + 1) }); });
      U.delegate(host, 'click', '[data-act="new-year-goal"]', function () { App.goals.newGoal(null, 'year'); });
      U.delegate(host, 'click', '.ygoal', function () { App.goals.edit(this.getAttribute('data-id')); });
    }
  });
})(window.App = window.App || {});

</script>
