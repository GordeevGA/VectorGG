<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-accent="indigo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вектор — личный центр управления жизнью</title>
<meta name="description" content="Личный трекер дня, привычек, целей, ретроспектив и аналитики. Все данные хранятся локально в браузере.">
<meta name="theme-color" content="#0d0e11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%235b6cff'/><path d='M8 21l8-11 8 11' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
/* ============================================================
   ВЕКТОР · дизайн-токены
   Цвета, размеры, шрифты и темы правятся ТОЛЬКО здесь.
   ============================================================ */

:root {
  /* --- Типографика ------------------------------------------------ */
  --font-sans: "Inter", "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  --fs-xs: 11.5px;
  --fs-sm: 13px;
  --fs-md: 14.5px;
  --fs-lg: 17px;
  --fs-xl: 22px;
  --fs-2xl: 30px;
  --fs-3xl: 40px;

  /* --- Ритм и радиусы --------------------------------------------- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 40px; --sp-9: 56px;

  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-full: 999px;

  --side-w: 246px;
  --max-w: 1180px;

  /* --- Акцент: оттенок задаётся темой [data-accent], светлоту даёт тема */
  --accent: hsl(var(--accent-h) var(--accent-s) var(--accent-l));
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 34%, transparent);
  --accent-ink: color-mix(in srgb, var(--accent) 78%, var(--text));

  /* --- Семантика -------------------------------------------------- */
  --ok: hsl(var(--ok-h) var(--ok-s) var(--ok-l));
  --warn: hsl(var(--warn-h) var(--warn-s) var(--warn-l));
  --bad: hsl(var(--bad-h) var(--bad-s) var(--bad-l));

  /* --- Палитра категорий (8 приглушённых оттенков) ----------------- */
  --cat-1: hsl(215 62% 62%);
  --cat-2: hsl(168 42% 48%);
  --cat-3: hsl(38 62% 58%);
  --cat-4: hsl(349 52% 62%);
  --cat-5: hsl(268 42% 66%);
  --cat-6: hsl(96 28% 50%);
  --cat-7: hsl(18 52% 58%);
  --cat-8: hsl(205 16% 58%);

  --ease: cubic-bezier(.22,.61,.36,1);
  --t-fast: .16s var(--ease);
  --t-med: .28s var(--ease);
}

/* ---------- Тёмная тема (по умолчанию) ---------------------------- */
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0e11;
  --bg-2: #0a0b0e;
  --surface: #15171c;
  --surface-2: #1b1e24;
  --surface-3: #22262e;
  --line: rgba(255,255,255,.075);
  --line-2: rgba(255,255,255,.13);
  --text: #eceef3;
  --text-2: #a3a9b6;
  --text-3: #6d7482;
  --shadow-s: 0 1px 2px rgba(0,0,0,.5);
  --shadow: 0 2px 4px rgba(0,0,0,.28), 0 18px 40px -22px rgba(0,0,0,.9);
  --shadow-l: 0 30px 70px -30px rgba(0,0,0,.95);
  --accent-l: 66%;
  --ok-h: 160; --ok-s: 55%; --ok-l: 48%;
  --warn-h: 38; --warn-s: 78%; --warn-l: 56%;
  --bad-h: 352; --bad-s: 62%; --bad-l: 60%;
  --heat-off: #1b1e24;
  --scrim: rgba(6,7,9,.68);
}

/* ---------- Светлая тема ------------------------------------------ */
[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f5f3;
  --bg-2: #efefec;
  --surface: #ffffff;
  --surface-2: #f8f8f6;
  --surface-3: #f0f0ed;
  --line: rgba(17,20,26,.09);
  --line-2: rgba(17,20,26,.16);
  --text: #14161b;
  --text-2: #5b6270;
  --text-3: #8b93a1;
  --shadow-s: 0 1px 2px rgba(16,24,40,.06);
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 16px 34px -20px rgba(16,24,40,.28);
  --shadow-l: 0 28px 60px -28px rgba(16,24,40,.35);
  --accent-l: 52%;
  --ok-h: 162; --ok-s: 58%; --ok-l: 38%;
  --warn-h: 34; --warn-s: 82%; --warn-l: 44%;
  --bad-h: 354; --bad-s: 62%; --bad-l: 48%;
  --heat-off: #eaeae5;
  --scrim: rgba(30,33,40,.38);

  --cat-1: hsl(215 62% 50%);
  --cat-2: hsl(168 45% 34%);
  --cat-3: hsl(36 70% 44%);
  --cat-4: hsl(349 55% 50%);
  --cat-5: hsl(268 42% 52%);
  --cat-6: hsl(96 30% 34%);
  --cat-7: hsl(18 55% 44%);
  --cat-8: hsl(205 14% 44%);
}

/* ---------- Оттенки акцента --------------------------------------- */
[data-accent="indigo"] { --accent-h: 232; --accent-s: 92%; }
[data-accent="teal"]   { --accent-h: 176; --accent-s: 58%; }
[data-accent="amber"]  { --accent-h: 33;  --accent-s: 84%; }
[data-accent="rose"]   { --accent-h: 345; --accent-s: 68%; }
[data-accent="moss"]   { --accent-h: 132; --accent-s: 38%; }

/* Утилиты,依赖 токенами */
.hide { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

</style>
<style>
/* ============================================================
   ВЕКТОР · база: сброс, типографика, layout
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-family: var(--font-sans);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  line-height: 1.58;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
ul, ol { list-style: none; }

.skip-link {
  position: absolute; left: -999px; top: 0;
  padding: var(--sp-3) var(--sp-4);
  background: var(--accent); color: var(--accent-ink);
  border-radius: var(--r-sm); font-weight: 700; z-index: 1000;
}
.skip-link:focus { left: var(--sp-4); }

/* ===== Приложение ===== */
.app {
  display: flex;
  min-height: 100vh;
}

/* ---------- Sidebar ---------- */
.side {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: var(--side-w);
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  z-index: 80;
}
.side-brand {
  padding: var(--sp-6) var(--sp-4) var(--sp-5);
  display: flex; align-items: center; gap: var(--sp-3);
}
.brand-mark {
  width: 34px; height: 34px; flex-shrink: 0;
  display: grid; place-items: center;
  color: var(--accent);
}
.brand-mark svg { width: 26px; height: 26px; }
.brand-text {
  display: flex; flex-direction: column; line-height: 1.25;
}
.brand-text b { font-size: var(--fs-md); font-weight: 800; letter-spacing: -.01em; }
.brand-text i {
  font-size: var(--fs-xs); font-style: normal;
  color: var(--text-3); letter-spacing: .03em; text-transform: uppercase;
}

.side-nav { flex: 1; overflow-y: auto; padding: 0 var(--sp-2); }
.side-nav .nav-group { margin-bottom: var(--sp-4); }
.side-nav .nav-label {
  font-size: var(--fs-xs); font-weight: 700; color: var(--text-3);
  padding: var(--sp-2) var(--sp-3) var(--sp-1); text-transform: uppercase;
  letter-spacing: .07em;
}
.side-nav .nav-item {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 500; color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast);
  cursor: pointer;
  user-select: none;
}
.side-nav .nav-item:hover { background: var(--surface-2); color: var(--text); }
.side-nav .nav-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.side-nav .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .72; }
.side-nav .nav-item.active svg { opacity: 1; }

.side-foot {
  padding: var(--sp-4); border-top: 1px solid var(--line);
  font-size: var(--fs-xs); color: var(--text-3); text-align: center;
}

/* ---------- Shell ---------- */
.shell {
  margin-left: var(--side-w);
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  min-height: 100vh;
}
.top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; flex-wrap: wrap;
  padding: var(--sp-3) var(--sp-7);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  gap: var(--sp-4);
}
.top-left { display: flex; align-items: center; gap: var(--sp-4); min-width: 0; flex: 1 1 auto; }
.top .icon-btn.top-menu { display: none; }
.top-title {
  font-size: var(--fs-lg); font-weight: 700; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top-sub {
  font-size: var(--fs-xs); color: var(--text-3);
  margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top-right { display: flex; align-items: center; gap: var(--sp-3); }

.top-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: var(--r-full);
  background: var(--surface-3); border: 1px solid var(--line);
  font-size: var(--fs-xs); font-weight: 600; color: var(--text-2);
  white-space: nowrap;
}

/* ---------- View ---------- */
.view {
  flex: 1;
  padding: var(--sp-7);
  animation: viewIn .22s var(--ease);
}
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }
.view-inner { max-width: var(--max-w); margin: 0 auto; min-width: 0; }

.credits {
  text-align: center; padding: var(--sp-5) var(--sp-4);
  font-size: var(--fs-xs); color: var(--text-3);
  display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
}

/* ---------- Tabs (mobile) ---------- */
.tabs {
  display: none;
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 70;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 6px 0 env(safe-area-inset-bottom, 6px);
  overflow-x: auto;
}
.tabs-inner {
  display: flex; justify-content: space-around;
  max-width: 500px; margin: 0 auto;
}
.tab-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0; font-size: 10px; font-weight: 600; color: var(--text-3);
  min-width: 48px; transition: color var(--t-fast);
  user-select: none;
}
.tab-item svg { width: 22px; height: 22px; opacity: .65; }
.tab-item.active { color: var(--accent-ink); }
.tab-item.active svg { opacity: 1; }

/* ---------- Общие утилиты ---------- */
.text-2 { color: var(--text-2); }
.text-3 { color: var(--text-3); }
.text-sm { font-size: var(--fs-sm); }
.text-xs { font-size: var(--fs-xs); }
.text-accent { color: var(--accent); }
.mono { font-family: var(--font-num); }
.mt-1 { margin-top: var(--sp-2); }
.mt-2 { margin-top: var(--sp-3); }
.mt-3 { margin-top: var(--sp-4); }
.mt-4 { margin-top: var(--sp-5); }
.mt-5 { margin-top: var(--sp-6); }
.mt-6 { margin-top: var(--sp-7); }
.mb-2 { margin-bottom: var(--sp-3); }
.mb-3 { margin-bottom: var(--sp-4); }
.mb-4 { margin-bottom: var(--sp-5); }
.gap-1 { gap: var(--sp-2); }
.gap-2 { gap: var(--sp-3); }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.grow { flex: 1; }

@media (max-width: 820px) {
  .side { display: none; }
  .shell { margin-left: 0; }
  .top .icon-btn.top-menu { display: grid; }
  .tabs { display: block; }
  .view { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  .credits { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
<style>
/* ============================================================
   ВЕКТОР · компоненты
   ============================================================ */

/* ---------- Карточки ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-s);
  padding: var(--sp-5);
}
.card--flush { padding: 0; overflow: hidden; }
.card--hover { transition: border-color var(--t-fast), box-shadow var(--t-fast); }
.card--hover:hover { border-color: var(--line-2); box-shadow: var(--shadow); }

.card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-3); margin-bottom: var(--sp-4); flex-wrap: wrap;
}
.card-title {
  font-size: var(--fs-xs); font-weight: 800; color: var(--text-3);
  text-transform: uppercase; letter-spacing: .09em;
  display: flex; align-items: center; gap: var(--sp-2);
}
.card-title svg { width: 15px; height: 15px; opacity: .8; }
.card-h {                            /* крупный заголовок блока */
  font-size: var(--fs-lg); font-weight: 700; letter-spacing: -.015em;
}
.card-note { font-size: var(--fs-xs); color: var(--text-3); }

.grid { display: grid; gap: var(--sp-4); }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.split { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); gap: var(--sp-4); align-items: start; }
.col { display: flex; flex-direction: column; gap: var(--sp-4); }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.row-tight { gap: var(--sp-2); }

/* ---------- Кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 15px; border-radius: var(--r-sm);
  font-size: var(--fs-sm); font-weight: 650; line-height: 1.2;
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text);
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast), opacity var(--t-fast);
  white-space: nowrap;
}
.btn svg { width: 16px; height: 16px; }
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .icon-btn:focus-visible, .chip-btn:focus-visible,
.nav-item:focus-visible, .cell:focus-visible, .seg-btn:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn--primary {
  background: var(--accent); border-color: transparent;
  color: var(--surface); font-weight: 700;
  box-shadow: 0 8px 20px -12px color-mix(in srgb, var(--accent) 90%, black);
}
.btn--primary:hover { background: color-mix(in srgb, var(--accent) 88%, white); }
.btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn--ghost:hover { background: var(--surface-2); color: var(--text); }
.btn--quiet { background: var(--surface-2); border-color: var(--line); }
.btn--danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: transparent; }
.btn--danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }
.btn--sm { padding: 6px 11px; font-size: var(--fs-xs); border-radius: var(--r-xs); }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.icon-btn {
  width: 34px; height: 34px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: var(--r-sm);
  color: var(--text-3); border: 1px solid transparent;
  transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
}
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn--line { border-color: var(--line); background: var(--surface); }

/* ---------- Чипы и бейджи ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: 600;
  background: var(--surface-3); color: var(--text-2);
  border: 1px solid var(--line); white-space: nowrap;
}
.chip svg { width: 12px; height: 12px; }
.chip--cat { background: color-mix(in srgb, var(--c, var(--cat-8)) 15%, transparent); color: var(--c, var(--cat-8)); border-color: transparent; }
.chip--hi { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); border-color: transparent; }
.chip--mid { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); border-color: transparent; }
.chip--low { background: var(--surface-3); color: var(--text-3); border-color: transparent; }
.chip--ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); border-color: transparent; }
.chip--accent { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.chip-btn { border-radius: var(--r-full); }
.chip-btn:hover { border-color: var(--line-2); color: var(--text); }

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex-shrink: 0; }
.dot--on { background: var(--accent); }

/* ---------- Прогресс ---------- */
.bar {
  height: 6px; border-radius: var(--r-full); background: var(--surface-3);
  overflow: hidden; position: relative;
}
.bar-fill {
  height: 100%; border-radius: var(--r-full);
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 62%, var(--ok)));
  transition: width .5s var(--ease);
}
.bar--thin { height: 4px; }
.bar--ok .bar-fill { background: var(--ok); }
.bar--warn .bar-fill { background: var(--warn); }

.ring { position: relative; display: inline-grid; place-items: center; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring-track { stroke: var(--surface-3); }
.ring-fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease); }
.ring-label {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-num); font-weight: 700; letter-spacing: -.03em;
}

/* ---------- Чекбокс задачи ---------- */
.check {
  width: 22px; height: 22px; flex-shrink: 0; border-radius: 7px;
  border: 1.6px solid var(--line-2); background: var(--surface-2);
  display: grid; place-items: center; color: transparent;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
}
.check svg { width: 14px; height: 14px; stroke-width: 3; }
.check:hover { border-color: var(--accent); }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.check[aria-checked="true"]:active { transform: scale(.9); }

/* ---------- Список задач ---------- */
.task {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: 11px var(--sp-3) 11px var(--sp-3);
  border-radius: var(--r-md);
  border: 1px solid transparent;
  transition: background var(--t-fast), border-color var(--t-fast), opacity var(--t-med);
}
.task:hover { background: var(--surface-2); border-color: var(--line); }
.task:hover .task-tools { opacity: 1; transform: none; }
.task-main { flex: 1; min-width: 0; }
.task-title { font-size: var(--fs-md); font-weight: 550; line-height: 1.4; word-break: break-word; }
.task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
.task--done { opacity: .48; }
.task--done .task-title { text-decoration: line-through; text-decoration-color: var(--text-3); }
.task-tools {
  display: flex; gap: 2px; opacity: 0; transform: translateX(4px);
  transition: opacity var(--t-fast), transform var(--t-fast);
}
.task-prio { width: 3px; align-self: stretch; border-radius: var(--r-full); background: var(--line-2); flex-shrink: 0; }
.task-prio[data-p="high"] { background: var(--bad); }
.task-prio[data-p="mid"] { background: var(--warn); }

<script>
/* Аварийная индикация загрузки. Если скрипт упал или страница не докачалась
   целиком, пользователь видит понятное сообщение, а не серый экран. */
(function () {
  var DEADLINE = 12000, t0 = Date.now(), bar = null, booted = false, timer = null;
  var BTN = 'padding:7px 12px;border-radius:9px;border:1px solid #3a3f4b;background:#22262f;' +
            'color:#e8eaf0;font:inherit;cursor:pointer';

  function box() {
    if (bar) return bar;
    bar = document.createElement('div');
    bar.id = 'boot-state';
    bar.setAttribute('role', 'status');
    bar.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;' +
      'max-width:min(92vw,520px);padding:12px 14px;border-radius:12px;background:#16181d;color:#e8eaf0;' +
      'border:1px solid #2b2f38;box-shadow:0 8px 30px rgba(0,0,0,.45);' +
      'font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif';
    document.body.appendChild(bar);
    return bar;
  }

  function show(text, fatal) {
    var el = box();
    el.style.borderColor = fatal ? '#7c3a45' : '#2b2f38';
    el.textContent = text;
    if (!fatal) return;
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap';
    var reload = document.createElement('button');
    reload.type = 'button'; reload.textContent = 'Обновить'; reload.style.cssText = BTN;
    reload.onclick = function () { location.reload(); };
    var reset = document.createElement('button');
    reset.type = 'button'; reset.textContent = 'Сбросить данные и обновить'; reset.style.cssText = BTN;
    reset.onclick = function () {
      try {
        Object.keys(localStorage).filter(function (k) { return k.indexOf('vector') === 0; })
          .forEach(function (k) { localStorage.removeItem(k); });
      } catch (e) { /* localStorage недоступен */ }
      location.reload();
    };
    row.appendChild(reload); row.appendChild(reset); el.appendChild(row);
  }

  function fail(reason) {
    if (booted) return;
    show('Вектор не запустился: ' + reason, true);
  }

  window.addEventListener('error', function (e) {
    if (booted) return;
    var where = (e && e.filename) ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : '';
    fail(((e && e.message) || 'ошибка скрипта') + where);
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    if (booted) return;
    var r = e && e.reason;
    fail('ошибка данных: ' + ((r && r.message) || r || 'неизвестно'));
  });

  timer = setInterval(function () {
    var v = document.getElementById('view');
    if (v && v.childElementCount > 0) {
      booted = true; clearInterval(timer);
      if (bar && bar.remove) bar.remove(); else if (bar) bar.parentNode.removeChild(bar);
      return;
    }
    var spent = Date.now() - t0;
    if (spent > 1500 && !bar) show('Загрузка Вектора…', false);
    if (spent > DEADLINE) {
      clearInterval(timer);
      show('Вектор не запустился: страница не успела загрузиться. ' +
           'Соединение очень медленное или обрвано — обнови страницу.', true);
    }
  }, 400);
})();
</script>

/* ============================================================

   ============================================================ */
(function (App) {
  'use strict';
  var U = {};

  /* ---------- Дата ---------- */
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };

  U.dateKey = function (d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  };
  U.todayKey = function () { return U.dateKey(new Date()); };
  U.parseKey = function (k) {
    var p = String(k).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2] || 1);
  };
  U.addDays = function (k, n) {
    var d = U.parseKey(k); d.setDate(d.getDate() + n); return U.dateKey(d);
  };
  U.diffDays = function (a, b) {
    return Math.round((U.parseKey(b).getTime() - U.parseKey(a).getTime()) / 86400000);
  };
  U.dow = function (k) { return U.parseKey(k).getDay(); }; /* 0 = Вс */
  U.mondayOf = function (k) { return U.addDays(k, -((U.dow(k) + 6) % 7)); };
  U.weekKeys = function (mon) {
    var r = []; for (var i = 0; i < 7; i++) r.push(U.addDays(mon, i)); return r;
  };
  U.monthKey = function (k) { return String(k).slice(0, 7); };
  U.monthStart = function (mk) { return mk + '-01'; };
  U.daysInMonth = function (mk) {
    var p = mk.split('-').map(Number); return new Date(p[0], p[1], 0).getDate();
  };
  U.monthKeysList = function (mk) {
    var d = U.daysInMonth(mk), r = [];
    for (var i = 1; i <= d; i++) r.push(mk + '-' + pad(i));
    return r;
  };
  U.addMonths = function (mk, n) {
    var p = mk.split('-').map(Number), d = new Date(p[0], p[1] - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  };
  U.rangeKeys = function (from, to) {
    var r = [], c = from;
    while (c <= to) { r.push(c); c = U.addDays(c, 1); }
    return r;
  };
  U.isFuture = function (k) { return k > U.todayKey(); };
  U.isToday = function (k) { return k === U.todayKey(); };
  U.isPast = function (k) { return k < U.todayKey(); };
  U.isSame = function (a, b) { return a === b; };

  /* ---------- Форматирование ---------- */
  var MONTHS_NOM = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MONTHS_GEN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var DOW_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  var DOW_SHORT = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  var DOW_LABEL = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var MONTH_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

  U.fmtLong = function (k) {
    var d = U.parseKey(k); return DOW_FULL[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_NOM[d.getMonth()];
  };
  U.fmtDate = function (k) { var d = U.parseKey(k); return d.getDate() + ' ' + MONTHS_NOM[d.getMonth()]; };
  U.fmtShort = function (k) { var d = U.parseKey(k); return d.getDate() + ' ' + MONTH_SHORT[d.getMonth()]; };
  U.fmtMonth = function (mk) { var p = mk.split('-').map(Number); return MONTHS_GEN[p[1]-1] + ' ' + p[0]; };
  U.fmtMonthShort = function (mk) { var p = mk.split('-').map(Number); return MONTH_SHORT[p[1]-1] + ' ' + p[0]; };
  U.fmtYear = function (y) { return y + ' год'; };

  U.relative = function (k) {
    var diff = U.diffDays(U.todayKey(), k);
    if (diff === 0) return 'сегодня';
    if (diff === 1) return 'завтра';
    if (diff === -1) return 'вчера';
    if (diff > 1) return 'через ' + diff + ' дн.';
    return (-diff) + ' дн. назад';
  };

  U.plural = function (n, forms) {
    var a = n % 100, b = n % 10;
    if (a >= 11 && a <= 19) return forms[2];
    if (b === 1) return forms[0];
    if (b >= 2 && b <= 4 && (a < 10 || a >= 20)) return forms[1];
    return forms[2];
  };

  U.minutesToHm = function (m) {
    if (!m) return '—';
    var h = Math.floor(m / 60), rm = m % 60;
    if (h > 0 && rm > 0) return h + ' ч ' + pad(rm) + ' м';
    if (h > 0) return h + ' ч';
    return rm + ' м';
  };

  /* ---------- Утилиты ---------- */
  var uid = 0;
  U.uid = function () { return 'x' + Date.now().toString(36) + (uid++).toString(36); };
  U.pct = function (a, b) { return b ? Math.round(a / b * 100) : 0; };
  U.clamp = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };
  U.round = function (n, d) { d = d || 0; var f = Math.pow(10, d); return Math.round(n * f) / f; };
  U.sum = function (arr, fn) { var s = 0; for (var i = 0; i < arr.length; i++) s += (fn ? fn(arr[i]) : arr[i]) || 0; return s; };
  U.mean = function (arr) { return arr.length ? U.sum(arr) / arr.length : 0; };

  /* ---------- Escape ---------- */

  U.esc = function (s) {

  /* Второй аргумент — область поиска. Без него поиск идёт по всему document,
     из-за чего id из уже удалённого экрана мог не найтись или найтись не тот. */
  U.$ = function (sel, ctx) { return (ctx || document).querySelector(sel); };
  U.$$ = function (sel, ctx) { return (ctx || document).querySelectorAll(sel); };
  U.delegate = function (el, evt, sel, fn) {
    el.addEventListener(evt, function (e) {
      var t = e.target;
      while (t && t !== el) {
        if (t.matches && t.matches(sel)) { fn.call(t, e); return; }
        t = t.parentNode;
      }
    });
  };
  U.on = function (el, evt, fn) { el.addEventListener(evt, fn); };

  /* ---------- Файлы ---------- */
  U.download = function (name, text, mime) {
    mime = mime || 'application/json';
    var b = new Blob([text], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; a.click();
    URL.revokeObjectURL(a.href);
  };
  U.readText = function (file) {
    return new Promise(function (ok, no) {
      var r = new FileReader();
      r.onload = function () { ok(r.result); };
      r.onerror = function () { no(r.error); };
      r.readAsText(file);
    });
  };

  /* ---------- Debounce ---------- */
  U.debounce = function (fn, ms) {
    var t;
    return function () {
      var a = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, a); }, ms);
    };
  };

  U.DOW_FULL = DOW_FULL;
  U.DOW_SHORT = DOW_SHORT;
  U.DOW_LABEL = DOW_LABEL;
  U.MONTH_SHORT = MONTH_SHORT;

  /* ---------- Массивы ---------- */
  U.groupBy = function (arr, fn) {
    var r = {};
    for (var i = 0; i < arr.length; i++) {
      var k = fn(arr[i]);
      (r[k] = r[k] || []).push(arr[i]);
    }
    return r;
  };
  U.unique = function (arr) { return [...new Set(arr)]; };
  U.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  };

  App.utils = U;
})(window.App = window.App || {});

/* ==== js/core/store.js ==== */
/* ============================================================
   ВЕКТОР · ядро: хранилище (localStorage + действия)
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils;

  var KEY = 'vector.v1';
  var XP = { task: 10, taskHi: 20, habit: 20, goal: 50, dayClose: 30 };
  var MAX_LOG = 300;

  function blank() {
    return {
      version: 1, createdAt: U.dateKey(),
      settings: { name: '', theme: 'dark', accent: 'indigo', dayTarget: 70, xp: true, weekStart: 1 },
      habits: [], tasks: [], goals: [], priorities: [],
      notes: [], thoughts: {}, retros: {}, closes: {},
      xp: { total: 0, log: [] }, achievements: {}, meta: { onboarded: false }
    };
  }

  var Store = {
    KEY: KEY, XP: XP,
    state: null, listeners: [],

    init: function () {
      this.state = this.load() || this.fresh();
      this.migrate();
    },

    fresh: function () {
      var s = blank();
      s.meta.onboarded = false;
      return s;
    },

    load: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var p = JSON.parse(raw);
        return p && p.__v === KEY ? p.data : p;
      } catch (e) { return null; }
    },

    save: function () {
      try {
        localStorage.setItem(KEY, JSON.stringify({ __v: KEY, data: this.state }));
      } catch (e) {
        if (window.App && window.App.ui) window.App.ui.toast('Хранилище переполнено. Экспортируйте данные.', 'bad');
      }
    },

    subscribe: function (fn) { this.listeners.push(fn); },

    emit: function (reason) {
      this.save();
      for (var i = 0; i < this.listeners.length; i++) this.listeners[i](reason);
    },

    set: function (fn) {
      fn(this.state);
      this.emit();
    },

    /* --- Мутации --- */
    addTask: function (o) {
      var t = { id: U.uid(), title: '', category: 'Бизнес', minutes: 30, priority: 'mid', date: U.todayKey(), goalId: null, done: false, doneAt: null, createdAt: Date.now() };
      for (var k in o) if (o[k] != null) t[k] = o[k];
      if (!t.title) t.title = t.category;
      this.state.tasks.push(t);
      this.emit('task');
    },

    updateTask: function (id, o) {
      var t = this.state.tasks.find(function (x) { return x.id === id; });
      if (!t) return;
      for (var k in o) if (o[k] != null) t[k] = o[k];
      this.emit('task');
    },

    removeTask: function (id) {
      var t = this.state.tasks.find(function (x) { return x.id === id; });
      if (t && t.done) this._awardXP(-XP.task, 'Отмена задачи');
      this.state.tasks = this.state.tasks.filter(function (x) { return x.id !== id; });
      this.emit('task');
    },

    toggleTask: function (id) {
      var t = this.state.tasks.find(function (x) { return x.id === id; });
      if (!t) return;
      t.done = !t.done;
      t.doneAt = t.done ? Date.now() : null;
      if (t.done) {
        this._awardXP(t.priority === 'high' ? XP.taskHi : XP.task, 'Задача: ' + U.esc(t.title));
      } else {
        this._awardXP(-(t.priority === 'high' ? XP.taskHi : XP.task), 'Отмена задачи');
      }
      this.emit('task');
    },

    addHabit: function (o) {
      var h = { id: U.uid(), name: '', category: 'Общее', minutes: 30, days: [0,1,2,3,4,5,6], log: {}, createdAt: U.todayKey() };
      for (var k in o) if (o[k] != null) h[k] = o[k];
      if (!h.name) h.name = o.category || 'Привычка';
      this.state.habits.push(h);
      this.emit('habit');
    },

    updateHabit: function (id, o) {
      var h = this.state.habits.find(function (x) { return x.id === id; });
      if (!h) return;
      for (var k in o) if (o[k] != null) h[k] = o[k];
      this.emit('habit');
    },

    removeHabit: function (id) {
      this.state.habits = this.state.habits.filter(function (x) { return x.id !== id; });
      this.emit('habit');
    },

    toggleHabit: function (id, date) {
      var h = this.state.habits.find(function (x) { return x.id === id; });
      if (!h) return;
      h.log = h.log || {};
      var was = h.log[date] || false;
      h.log[date] = !was;
      if (h.log[date]) {
        this._awardXP(XP.habit, 'Привычка: ' + U.esc(h.name));
      } else {
        this._awardXP(-XP.habit, 'Отмена привычки');
      }
      this.emit('habit');
    },

    addGoal: function (o) {
      var g = { id: U.uid(), title: '', desc: '', horizon: 'week', parentId: null, deadline: null, priority: 'mid', status: 'active', manual: 0, metric: null, createdAt: Date.now(), doneAt: null };
      for (var k in o) if (o[k] != null) g[k] = o[k];
      if (!g.title) g.title = 'Новая цель';
      this.state.goals.push(g);
      this.emit('goal');
    },

    updateGoal: function (id, o) {
      var g = this.state.goals.find(function (x) { return x.id === id; });
      if (!g) return;
      for (var k in o) if (o[k] != null) g[k] = o[k];
      this.emit('goal');
    },

    removeGoal: function (id) {
      this.state.goals = this.state.goals.filter(function (x) { return x.id !== id; });
      this.emit('goal');
    },

    cycleGoalStatus: function (id) {
      var g = this.state.goals.find(function (x) { return x.id === id; });
      if (!g) return;
      var cycle = { active: 'done', done: 'archived', archived: 'active', paused: 'active' };
      var old = g.status;
      g.status = cycle[g.status] || 'active';
      if (g.status === 'done') {
        g.doneAt = Date.now();
        this._awardXP(XP.goal, 'Цель достигнута: ' + U.esc(g.title));
      } else {
        g.doneAt = null;
        this._awardXP(-XP.goal, 'Цель снята');
      }
      this.emit('goal');
    },

    setPriorities: function (ids) {
      this.state.priorities = (ids || []).slice(0, 3);
      this.emit('goal');
    },

    setThought: function (date, text) {
      this.state.thoughts = this.state.thoughts || {};
      if (!text.trim()) { delete this.state.thoughts[date]; }
      else { this.state.thoughts[date] = text.trim(); }
      this.emit('thought');
    },

    addNote: function (o) {
      var n = { id: U.uid(), text: '', date: U.dateKey(), tags: [], createdAt: Date.now() };
      for (var k in o) if (o[k] != null) n[k] = o[k];
      if (!n.text) n.text = 'Без текста';
      this.state.notes.push(n);
      this.emit('note');
    },

    updateNote: function (id, o) {
      var n = this.state.notes.find(function (x) { return x.id === id; });
      if (!n) return;
      for (var k in o) if (o[k] != null) n[k] = o[k];
      this.emit('note');
    },

    removeNote: function (id) {
      this.state.notes = this.state.notes.filter(function (x) { return x.id !== id; });
      this.emit('note');
    },

    saveRetro: function (scope, period, answers) {
      var key = scope + ':' + period;
      this.state.retros = this.state.retros || {};
      this.state.retros[key] = { answers: answers || {}, updatedAt: Date.now() };
      this.emit('retro');
    },

    closeDay: function (date, opts) {
      opts = opts || {};
      this.state.closes = this.state.closes || {};
      this.state.closes[date] = { at: Date.now(), score: opts.score || 0, retro: !!opts.retro };
      if (opts.retro) {
        this.state.settings.lastRetroDate = date;
      }
      this._awardXP(XP.dayClose, 'Закрытие дня');
      this.emit('day');
    },

    _awardXP: function (amount, reason) {
      if (!this.state.settings.xp) return;
      var total = this.state.xp.total + amount;
      if (total < 0) total = 0;
      this.state.xp.total = total;
      this.state.xp.log = this.state.xp.log || [];
      this.state.xp.log.push({ at: Date.now(), amount: amount, reason: reason, date: U.dateKey() });
      if (this.state.xp.log.length > MAX_LOG) this.state.xp.log = this.state.xp.log.slice(-MAX_LOG);
    },

    /* --- Импорт / Экспорт --- */
    exportJSON: function () {
      return JSON.stringify({ __v: KEY, data: this.state }, null, 2);
    },

    /* Принимает только файл, похожий на выгрузку Вектора: иначе случайный
       JSON из другого приложения стёр бы все данные. */
    looksLikeVector: function (d) {
      if (!d || typeof d !== 'object' || Array.isArray(d)) return false;
      var arrs = ['habits', 'tasks', 'goals'];
      if (!arrs.every(function (k) { return Array.isArray(d[k]); })) return false;
      if (!d.settings || typeof d.settings !== 'object') return false;
      return !!(d.xp && typeof d.xp.total === 'number');
    },

    importData: function (raw) {
      try {
        var p = JSON.parse(raw);
        var d = p && p.__v === KEY ? p.data : p;
        if (!this.looksLikeVector(d)) return false;
        this.state = this.merge(d);
        this.emit();
        return true;
      } catch (e) { return false; }
    },

    /* Старый файл мог не содержать новых полей — достраиваем их из blank() */
    merge: function (d) {
      var base = blank();
      var s = Object.assign(base, d);
      s.settings = Object.assign(base.settings, d.settings || {});
      s.xp = { total: (d.xp && d.xp.total) || 0, log: (d.xp && d.xp.log) || [] };
      s.meta = Object.assign(base.meta, d.meta || {});
      this.state = s;
      this.migrate();
      return s;
    },

    resetAll: function () {
      localStorage.removeItem(KEY);
      this.state = this.fresh();
      this.emit();
    },

    /* --- Миграции --- */
    migrate: function () {
      if (!this.state.habits) this.state.habits = [];
      if (!this.state.tasks) this.state.tasks = [];
      if (!this.state.goals) this.state.goals = [];
      if (!this.state.priorities) this.state.priorities = [];
      if (!this.state.notes) this.state.notes = [];
      if (!this.state.thoughts) this.state.thoughts = {};
      if (!this.state.retros) this.state.retros = {};
      if (!this.state.closes) this.state.closes = {};
      if (!this.state.xp) this.state.xp = { total: 0, log: [] };
      if (!this.state.achievements) this.state.achievements = {};
      if (!this.state.settings) this.state.settings = {};
    }
  };

  App.store = Store;
})(window.App = window.App || {});

<script>
/* ==== js/core/stats.js ==== */
/* ============================================================
   ВЕКТОР · ядро: статистика, streak, XP, инсайты, цели
   ============================================================ */
(function (App) {
  'use strict';
  var U = App.utils;
  var S = App.store;

  var XP_THRESHOLDS = [0, 100, 250, 450, 700, 1000, 1400, 1900, 2500, 3200, 4000, 5000];
  var XP_TASK = 10, XP_TASK_HI = 20, XP_HABIT = 20, XP_GOAL = 50, XP_DAY_CLOSE = 30;

  var Stats = {};

  /* ---------- XP и уровни ---------- */
  Stats.levelInfo = function () {
    var xp = S.state.xp.total;
    var lvl = 1, next = XP_THRESHOLDS[1];
    for (var i = 0; i < XP_THRESHOLDS.length - 1; i++) {
      if (xp >= XP_THRESHOLDS[i + 1]) { lvl = i + 2; } else { next = XP_THRESHOLDS[i + 1]; break; }
      if (i === XP_THRESHOLDS.length - 2) next = XP_THRESHOLDS[XP_THRESHOLDS.length - 1];
    }
    var floor = XP_THRESHOLDS[lvl - 1] || 0;
    return { level: lvl, xp: xp, next: next, floor: floor, pct: U.pct(xp - floor, next - floor) };
  };

  /* ---------- День ---------- */
  Stats.daySnapshot = function (dateKey) {
    var tasks = S.state.tasks.filter(function (t) { return t.date === dateKey; });
    var habits = S.state.habits.filter(function (h) {
      if (h.createdAt && h.createdAt > dateKey) return false;
      var d = U.dow(dateKey);
      return (h.days || [0,1,2,3,4,5,6]).indexOf(d) !== -1;
    });
    var habitsDone = habits.filter(function (h) { return h.log && h.log[dateKey]; });
    var tasksDone = tasks.filter(function (t) { return t.done; });
    var total = tasks.length + habits.length;
    var done = tasksDone.length + habitsDone.length;
    var pct = total ? Math.round(done / total * 100) : 0;
    var minPlanned = U.sum(tasks, function (t) { return t.minutes || 0; }) + U.sum(habits, function (h) { return h.minutes || 0; });
    var minDone = U.sum(tasksDone, function (t) { return t.minutes || 0; }) + U.sum(habitsDone, function (h) { return h.minutes || 0; });
    return {
      date: dateKey, tasks: tasks, habits: habits,
      tasksDone: tasksDone.length, tasksTotal: tasks.length,
      habitsDone: habitsDone.length, habitsTotal: habits.length,
      done: done, total: total, pct: pct,
      minPlanned: minPlanned, minDone: minDone,
      closed: !!(S.state.closes[dateKey]),
      thought: S.state.thoughts[dateKey] || ''
    };
  };

  /* ---------- Streak ---------- */
  Stats.overallStreak = function () {
    var target = S.state.settings.dayTarget || 70;
    var today = U.todayKey();
    var snap = Stats.daySnapshot(today);
    var cur = snap.pct >= target ? 1 : 0;
    if (cur === 0) {
      var y = U.addDays(today, -1);
      var ys = Stats.daySnapshot(y);
      if (ys.pct >= target) { cur = 1; today = y; }
      else return 0;
    }
    var d = U.addDays(today, -1);
    for (var i = 0; i < 400; i++) {
      var s = Stats.daySnapshot(d);
      if (s.total === 0) { d = U.addDays(d, -1); continue; }
      if (s.pct >= target) { cur++; d = U.addDays(d, -1); } else break;
    }
    return cur;
  };

  Stats.bestStreak = function () {
    var target = S.state.settings.dayTarget || 70;
    var best = 0, cur = 0;
    var keys = Stats._allKeysWithItems();
    keys.sort();
    for (var i = 0; i < keys.length; i++) {
      var s = Stats.daySnapshot(keys[i]);
      if (s.total === 0) continue;
      if (s.pct >= target) { cur++; if (cur > best) best = cur; } else { cur = 0; }
    }
    return best;
  };

  Stats._allKeysWithItems = function () {
    var set = {};
    S.state.tasks.forEach(function (t) { set[t.date] = 1; });
    S.state.habits.forEach(function (h) {
      if (h.log) Object.keys(h.log).forEach(function (k) { if (h.log[k]) set[k] = 1; });
    });
    var today = U.todayKey();
    var d = U.addMonths(today.slice(0, 7) + '-01', -3);
    while (d <= today) { if (set[d]) set[d] = 1; d = U.addDays(d, 1); }
    return Object.keys(set);
  };

  /* ---------- Привычки ---------- */
  Stats.habitStats = function (habit, from, to) {
    var keys = U.rangeKeys(from, to);
    var planned = keys.filter(function (k) {
      if (habit.createdAt && k < habit.createdAt) return false;
      return (habit.days || [0,1,2,3,4,5,6]).indexOf(U.dow(k)) !== -1;
    });
    var done = planned.filter(function (k) { return habit.log && habit.log[k]; });
    var pct = planned.length ? Math.round(done.length / planned.length * 100) : 0;
    /* streak */
    var streak = 0, bestStreak = 0, cur = 0;
    for (var i = 0; i < planned.length; i++) {
      var k = planned[i];
      if (habit.log && habit.log[k]) { cur++; if (cur > bestStreak) bestStreak = cur; } else { cur = 0; }
    }
    streak = cur;
    var todayK = U.todayKey();
    if (planned.length && planned[planned.length - 1] >= todayK) {
      if (!habit.log || !habit.log[todayK]) streak = Math.max(0, cur - 1);
    }
    return {
      id: habit.id, name: habit.name, category: habit.category,
      planned: planned.length, done: done.length, pct: pct,
      currentStreak: streak, bestStreak: bestStreak
    };
  };

  Stats.allHabitsStats = function (from, to) {
    return S.state.habits.map(function (h) { return Stats.habitStats(h, from, to); });
  };

  /* ---------- Неделя ---------- */
  Stats.weekSummary = function (mondayKey) {
    var days = U.weekKeys(mondayKey);
    var snaps = days.map(Stats.daySnapshot);
    var tasksDone = U.sum(snaps, function (s) { return s.tasksDone; });
    var tasksTotal = U.sum(snaps, function (s) { return s.tasksTotal; });
    var habitsDone = U.sum(snaps, function (s) { return s.habitsDone; });
    var habitsTotal = U.sum(snaps, function (s) { return s.habitsTotal; });
    var minDone = U.sum(snaps, function (s) { return s.minDone; });
    var totalPct = U.pct(tasksDone + habitsDone, tasksTotal + habitsTotal);
    var prodDays = snaps.filter(function (s) { return s.total > 0 && s.pct >= (S.state.settings.dayTarget || 70); }).length;
    return {
      monday: mondayKey, days: days, snaps: snaps,
      tasksDone: tasksDone, tasksTotal: tasksTotal,
      habitsDone: habitsDone, habitsTotal: habitsTotal,
      minDone: minDone, pct: totalPct, prodDays: prodDays
    };
  };

  /* ---------- Месяц ---------- */
  Stats.monthSummary = function (monthKey) {
    var keys = U.monthKeysList(monthKey);
    var today = U.todayKey();
    var keysUpTo = keys.filter(function (k) { return k <= today; });
    var snaps = keysUpTo.map(Stats.daySnapshot);
    var tasksDone = U.sum(snaps, function (s) { return s.tasksDone; });
    var tasksTotal = U.sum(snaps, function (s) { return s.tasksTotal; });
    var habitsDone = U.sum(snaps, function (s) { return s.habitsDone; });
    var habitsTotal = U.sum(snaps, function (s) { return s.habitsTotal; });
    var minDone = U.sum(snaps, function (s) { return s.minDone; });
    var avgPct = snaps.length ? Math.round(U.mean(snaps.filter(function (s) { return s.total > 0; }).map(function (s) { return s.pct; }))) : 0;
    var prodDays = snaps.filter(function (s) { return s.total > 0 && s.pct >= (S.state.settings.dayTarget || 70); }).length;
    var goalsDone = S.state.goals.filter(function (g) { return g.status === 'done' && g.deadline && g.deadline.slice(0, 7) === monthKey; }).length;
    return {
      monthKey: monthKey, snaps: snaps, days: keysUpTo,
      tasksDone: tasksDone, tasksTotal: tasksTotal,
      habitsDone: habitsDone, habitsTotal: habitsTotal,
      minDone: minDone, avgPct: avgPct, prodDays: prodDays, goalsDone: goalsDone
    };
  };

  /* ---------- Год ---------- */
  Stats.yearSummary = function (year) {
    var mk = String(year);
    var months = [];
    for (var m = 1; m <= 12; m++) {
      var mKey = mk + '-' + (m < 10 ? '0' : '') + m;
      months.push(Stats.monthSummary(mKey));
    }
    var tasksDone = U.sum(months, function (s) { return s.tasksDone; });
    var tasksTotal = U.sum(months, function (s) { return s.tasksTotal; });
    var habitsDone = U.sum(months, function (s) { return s.habitsDone; });
    var habitsTotal = U.sum(months, function (s) { return s.habitsTotal; });
    var goalsDone = S.state.goals.filter(function (g) {
      return g.status === 'done' && g.deadline && g.deadline.slice(0, 4) === String(year);
    }).length;
    var prodDays = U.sum(months, function (s) { return s.prodDays; });
    return {
      year: year, months: months,
      tasksDone: tasksDone, tasksTotal: tasksTotal,
      habitsDone: habitsDone, habitsTotal: habitsTotal,
      goalsDone: goalsDone, prodDays: prodDays,
      pct: U.pct(tasksDone + habitsDone, tasksTotal + habitsTotal)
    };
  };

  /* ---------- Цели: прогресс ---------- */
  Stats.goalProgress = function (goalId) {
    var g = S.state.goals.find(function (x) { return x.id === goalId; });
    if (!g) return { pct: 0, source: 'none', label: '' };
    if (g.status === 'done') return { pct: 100, source: 'done', label: 'Выполнено' };
    if (g.status === 'archived') return { pct: 0, source: 'archived', label: 'Архив' };
    /* metric */
    if (g.metric && g.metric.target > 0) {
      var cur = g.metric.current || 0;
      var p = Math.min(100, Math.round(cur / g.metric.target * 100));
      return { pct: p, source: 'metric', label: cur + ' / ' + g.metric.target + ' ' + (g.metric.unit || '') };
    }
    /* children */
    var children = S.state.goals.filter(function (x) { return x.parentId === goalId; });
    if (children.length) {
      var avg = Math.round(U.mean(children.map(function (c) { return Stats.goalProgress(c.id).pct; })));
      var doneN = children.filter(function (c) { return c.status === 'done'; }).length;
      return { pct: avg, source: 'children', label: doneN + ' / ' + children.length + ' этапов' };
    }
    /* linked tasks */
    var tasks = S.state.tasks.filter(function (t) { return t.goalId === goalId; });
    if (tasks.length) {
      var dn = tasks.filter(function (t) { return t.done; }).length;
      return { pct: U.pct(dn, tasks.length), source: 'tasks', label: dn + ' / ' + tasks.length + ' задач' };
    }
    return { pct: g.manual || 0, source: 'manual', label: '' };
  };

  Stats.goalsByHorizon = function (h) {
    return S.state.goals.filter(function (g) {
      return g.horizon === h && g.status !== 'archived';
    }).sort(function (a, b) {
      var pr = { high: 0, mid: 1, low: 2 };
      return (pr[a.priority] || 1) - (pr[b.priority] || 1);
    });
  };

  Stats.topGoals = function () {
    var pids = S.state.priorities;
    return pids.map(function (id) {
      var g = S.state.goals.find(function (x) { return x.id === id; });
      return g ? { goal: g, progress: Stats.goalProgress(id) } : null;
    }).filter(Boolean);
  };

  /* ---------- Инсайты ---------- */
  Stats.insights = function (days) {
    days = days || 30;
    var today = U.todayKey();
    var from = U.addDays(today, -days + 1);
    var keys = U.rangeKeys(from, today);
    var snaps = keys.map(Stats.daySnapshot);
    var result = [];

    /* 1. Процент привычек */
    var habTotal = U.sum(snaps, function (s) { return s.habitsTotal; });
    var habDone = U.sum(snaps, function (s) { return s.habitsDone; });
    if (habTotal > 0) {
      result.push({ icon: '✓', text: 'Ты выполнил <b>' + U.pct(habDone, habTotal) + '%</b> привычек за последние ' + days + ' дн.' });
    }

    /* 2. Самая стабильная привычка */
    var hs = Stats.allHabitsStats(from, today);
    var sorted = hs.filter(function (h) { return h.planned >= 5; }).sort(function (a, b) { return b.pct - a.pct; });
    if (sorted.length) {
      result.push({ icon: '🔒', text: 'Самая стабильная привычка — <b>' + U.esc(sorted[0].name) + '</b> (' + sorted[0].pct + '%)' });
    }

    /* 3. Самый продуктивный день недели */
    var byDow = {};
    snaps.forEach(function (s) {
      if (s.total === 0) return;
      var d = U.dow(s.date);
      byDow[d] = (byDow[d] || []).concat([s.pct]);
    });
    var dowBest = null, dowBestAvg = -1;
    Object.keys(byDow).forEach(function (k) {
      var arr = byDow[k];
      if (arr.length >= 3) {
        var avg = U.mean(arr);
        if (avg > dowBestAvg) { dowBestAvg = avg; dowBest = k; }
      }
    });
    if (dowBest !== null) {
      result.push({ icon: '📅', text: 'В <b>' + U.DOW_FULL[Number(dowBest)].toLowerCase() + '</b> твоя продуктивность выше всего (' + Math.round(dowBestAvg) + '%)' });
    }

    /* 4. Streak */
    var streak = Stats.overallStreak();
    if (streak > 0) {
      result.push({ icon: '🔥', text: 'Текущая серия: <b>' + streak + ' ' + U.plural(streak, ['день','дня','дней']) + '</b> подряд' });
    }

    /* 5. Самая проблемная привычка */
    var sortedW = hs.filter(function (h) { return h.planned >= 5; }).sort(function (a, b) { return a.pct - b.pct; });
    if (sortedW.length && sortedW[0].pct < 60) {
      result.push({ icon: '⚠', text: 'Самая проблемная привычка — <b>' + U.esc(sortedW[0].name) + '</b> (' + sortedW[0].pct + '%)' });
    }

    return result.slice(0, 6);
  };

  /* ---------- Достижения ---------- */
  Stats.checkAchievements = function () {
    var s = S.state;
    var unlocked = s.achievements || {};
    var streak = Stats.overallStreak();
    var bestStreak = Stats.bestStreak();
    var totalTasks = s.tasks.filter(function (t) { return t.done; }).length;
    var totalHabits = U.sum(s.habits, function (h) { return h.log ? Object.values(h.log).filter(Boolean).length : 0; });
    var totalGoals = s.goals.filter(function (g) { return g.status === 'done'; }).length;
    var totalRetro = Object.keys(s.retros || {}).length;
    var level = Stats.levelInfo().level;

    var defs = [
      { id: 'streak7', icon: '🔥', name: '7 дней подряд', desc: 'Серия 7+ дней', check: function () { return bestStreak >= 7; } },
      { id: 'streak30', icon: '🔥', name: '30 дней подряд', desc: 'Серия 30+ дней', check: function () { return bestStreak >= 30; } },
      { id: 'tasks100', icon: '✅', name: '100 задач', desc: 'Выполнил 100+ задач', check: function () { return totalTasks >= 100; } },
      { id: 'habits500', icon: '⭐', name: '500 отметок', desc: '500+ отметок привычек', check: function () { return totalHabits >= 500; } },
      { id: 'goal1', icon: '🎯', name: 'Первая цель', desc: 'Закрой первую цель', check: function () { return totalGoals >= 1; } },
      { id: 'goal10', icon: '🏆', name: '10 целей', desc: '10+ целей достигнуто', check: function () { return totalGoals >= 10; } },
      { id: 'retro5', icon: '💭', name: 'Ретроспектива', desc: '5 ретроспектив', check: function () { return totalRetro >= 5; } },
      { id: 'level5', icon: '🚀', name: 'Уровень 5', desc: 'Достигни 5 уровня', check: function () { return level >= 5; } }
    ];

    var newly = [];
    defs.forEach(function (a) {
      if (!unlocked[a.id] && a.check()) {
        unlocked[a.id] = { at: Date.now() };
        newly.push(a);
      }
    });
    if (newly.length) { s.achievements = unlocked; S.save(); }
    return newly;
  };

  Stats.achievementDefs = function () {
    var s = S.state;
    var totalTasks = s.tasks.filter(function (t) { return t.done; }).length;
    var totalHabits = U.sum(s.habits, function (h) { return h.log ? Object.values(h.log).filter(Boolean).length : 0; });
    var totalGoals = s.goals.filter(function (g) { return g.status === 'done'; }).length;
    var totalRetro = Object.keys(s.retros || {}).length;
    var bestStreak = Stats.bestStreak();
    var level = Stats.levelInfo().level;
    return [
      { id: 'streak7', icon: '🔥', name: '7 дней подряд', desc: 'Серия 7+ дней', done: bestStreak >= 7 },
      { id: 'streak30', icon: '🔥', name: '30 дней подряд', desc: 'Серия 30+ дней', done: bestStreak >= 30 },
      { id: 'tasks100', icon: '✅', name: '100 задач', desc: 'Выполнил 100+ задач', done: totalTasks >= 100 },
      { id: 'habits500', icon: '⭐', name: '500 отметок', desc: '500+ отметок', done: totalHabits >= 500 },
      { id: 'goal1', icon: '🎯', name: 'Первая цель', desc: 'Закрой первую цель', done: totalGoals >= 1 },
      { id: 'goal10', icon: '🏆', name: '10 целей', desc: '10+ целей', done: totalGoals >= 10 },
      { id: 'retro5', icon: '💭', name: 'Ретроспектива', desc: '5 ретроспектив', done: totalRetro >= 5 },
      { id: 'level5', icon: '🚀', name: 'Уровень 5', desc: '5 уровень', done: level >= 5 }
    ];
  };

  /* ---------- Данные для графиков ---------- */
  Stats.dailyPctSeries = function (from, to) {
    return U.rangeKeys(from, to).map(function (k) {
      return { date: k, pct: Stats.daySnapshot(k).pct };
    });
  };

  Stats.weeklyPctSeries = function (weeks) {
    var today = U.mondayOf(U.todayKey());
    var result = [];
    for (var i = weeks - 1; i >= 0; i--) {
      var mon = U.addDays(today, -7 * i);
      var ws = Stats.weekSummary(mon);
      result.push({ label: U.fmtShort(mon), pct: ws.pct });
    }
    return result;
  };

  Stats.monthlyPctSeries = function (months) {
    var mk = U.monthKey(U.todayKey());
    var result = [];
    for (var i = months - 1; i >= 0; i--) {
      var m = U.addMonths(mk, -i);
      var ms = Stats.monthSummary(m);
      result.push({ label: U.fmtMonthShort(m), pct: ms.avgPct });
    }
    return result;
  };

  App.stats = Stats;
})(window.App = window.App || {});

</script>
<script>
/* ==== js/core/router.js ==== */
/* ============================================================
   ВЕКТОР · ядро: роутер (hash-навигация)
   ============================================================ */
(function (App) {
  'use strict';
  var R = {};
  R.routes = [];
  R.current = null;

  R.register = function (route) { R.routes.push(route); };

  R.parse = function () {
    var h = location.hash.replace(/^#\/?/, '');
    if (!h) return { id: 'today', params: {} };
    var parts = h.split('?');
    var q = {};
    if (parts[1]) parts[1].split('&').forEach(function (p) {
      var kv = p.split('='); q[kv[0]] = kv[1];
    });
    return { id: parts[0] || 'today', params: q };
  };

  R.go = function (id, params) {
    var qs = '';
    if (params) {
      var parts = [];
      for (var k in params) if (params[k] != null) parts.push(k + '=' + encodeURIComponent(params[k]));
      if (parts.length) qs = '?' + parts.join('&');
    }
    location.hash = '#' + id + qs;
  };

  R.render = function () {
    var route = R.parse();
    var found = R.routes.find(function (r) { return r.id === route.id; });
    if (!found) { R.go('today'); return; }
    R.current = found;

    /* Новый <main> вместо старого: снимает все слушатели предыдущего рендера.
       Иначе U.delegate навешивал бы обработчики поверх старых и один клик
       вызывал бы действие несколько раз. */
    var old = App.utils.$('#view');
    var view = document.createElement('main');
    view.className = 'view';
    view.id = 'view';
    view.setAttribute('tabindex', '-1');
    old.parentNode.replaceChild(view, old);

    if (found.render) found.render(view, route.params);
    view.style.opacity = '1';
    App.ui.updateNav(route.id);
    App.ui.updateTop(found, route.params);
  };

  R.start = function () {
    App.utils.on(window, 'hashchange', R.render);
    R.render();
  };

  App.router = R;
})(window.App = window.App || {});

</script>
